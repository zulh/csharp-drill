    mig:
"## Why migrate to .NET 8\n\n.NET Framework is **Windows-only and in maintenance mode**, no new features, just security fixes. .NET 8 is the modern unified platform, and you migrate for **performance** (much faster, lower hosting cost), **cross-platform and containers** (host on Linux, cloud-native), **LTS support** (three years), and access to modern C# and the current library ecosystem.\n\nOne line: Framework is legacy and Windows-locked; .NET 8 is faster, cross-platform, cloud-ready, and actively supported.\n\n## The .NET landscape\n\n- **.NET Framework (up to 4.8)** — original, Windows-only, still supported but maintenance-only.\n- **.NET Core (1 to 3.1)** — the cross-platform, open-source rewrite where the modern model came from.\n- **.NET 5+** — Microsoft dropped the \"Core\" and \"Framework\" names and unified into just **.NET**, so 5, 6, 7, 8 are one continuing line, and **.NET 8 is the current LTS**.\n- **.NET Standard** — a spec both worlds implement, so a `netstandard2.0` library works on both, which makes it the bridge for shared libraries during a migration.\n\n## Migration approach\n\nGo **incremental, not big-bang**. The **Strangler Fig** pattern stands the new .NET 8 app up alongside the old one with a proxy (often **YARP**) in front, and you migrate one module at a time, shifting traffic as each piece is proven, until the old app is fully replaced. The app keeps running throughout, so you deliver value continuously and de-risk. The **.NET Upgrade Assistant** and **try-convert** automate much of the mechanical work. Big-bang only makes sense for small apps.\n\n## Common blockers\n\nThe mechanical retargeting is easy; the blockers are the Framework-only pieces. `System.Web` doesn't exist in modern .NET. **WebForms** has no migration path and must be rewritten (to MVC/Razor or Blazor). **WCF** server isn't supported, so move to CoreWCF or gRPC/REST. `Global.asax` becomes `Program.cs`, `web.config` becomes `appsettings.json` plus the Options pattern, and HttpModules/Handlers become middleware. `packages.config` becomes `PackageReference` and old `.csproj` becomes SDK-style. Some third-party packages have no .NET version, and AppDomains, Remoting, and Code Access Security aren't supported at all.\n\n## Strategy, tooling, and risk\n\n**Assess first** with the **Portability Analyzer** to see how much uses unavailable APIs, which drives the roadmap. Migrate **bottom-up**, leaf libraries first, targeting **.NET Standard** where possible so they run on both during the transition. Convert project files to SDK style, replace incompatible APIs, and protect behaviour with **characterization tests** written before you change anything. Ship incrementally and validate at each step. As the tech lead, the risk story is: assess early, sequence by risk and dependency, deliver in safe increments, guard quality with tests and code review, and keep a live risk log you escalate early.",

    finago:
"## What I built\n\nThe task was a hotel-booking system, and rather than build every feature shallowly, I picked one main flow and did it properly, and went deep on the hardest part. The stack was React with MUI on the front end, and Node with TypeScript, TypeORM, and SQLite on the back end.\n\nThe backend is **layered**: thin **routes** that just handle the HTTP, **services** where the actual logic lives, and **entities** for the tables. So the interesting logic sits in one place and is easy to test. The front end is split by feature, search, booking, calendar, staff, and loyalty.\n\n## Preventing double-booking (the core)\n\nThe hard part is stopping two people booking the same room for overlapping dates at the same time. It's a **race condition**, both requests check \"is it free\", both see yes, and both book.\n\nMy solution was layered: a **lock** (an async mutex) so only one check-and-write runs at a time, a **transaction** so it's all-or-nothing, an **overlap check** as the source of truth (a clash is when an existing booking's check-in is before my check-out and its check-out is after my check-in), and an **idempotency key** so a repeated request returns the original booking. One wins with a **201**, the rest get a **409**. I proved it by firing five simultaneous requests, one booked, four got 409.\n\n## Data model\n\nThe main tables are RoomType, Room, Customer, Reservation, and an append-only AuditLog. Everything centers on the Reservation, which links a Room and a Customer for a date range.\n\nTwo deliberate choices: **money is stored as integer cents**, not a float, because floats give rounding errors (0.1 plus 0.2 isn't exactly 0.3), and **dates are a half-open interval**, so someone checking out on the 10th doesn't clash with someone checking in on the 10th.\n\n## Partner API and security\n\nBecause bookings can come from third-party sites, I built a separate partner API. I secured it with **API-key authentication** where I only store a **SHA-256 hash** of the key, so a leak can't be used to impersonate a partner, and **per-partner rate limiting** with a token bucket. Partner bookings go through the **same** booking logic, so the double-booking guarantee holds across channels, and a partner can only see their own bookings.\n\n## Tradeoffs and with more time\n\nI used **SQLite** for zero setup; the tradeoff is it can't do a database-level exclusion constraint, so the guarantee lives in the app. I used an **in-app lock**, which is correct for one instance; at scale I'd move it into the database with a Postgres serializable transaction, a SELECT FOR UPDATE, or an exclusion constraint. I let TypeORM auto-create the schema; in production I'd use **migrations**. And overall I chose **depth over breadth** on purpose, which the case actually invited.",

    aspnet:
"## The request pipeline (middleware)\n\nIn ASP.NET Core, every request flows through a **middleware pipeline**, a chain of components you configure in `Program.cs`. Each one can do work, then call `next` to pass the request along, or short-circuit and respond itself. The request goes down the chain and the response comes back up.\n\n```csharp\napp.UseExceptionHandler();\napp.UseAuthentication();\napp.UseAuthorization();\napp.MapControllers();\n```\n\n**Order matters**, authentication must come before authorization, and exception handling goes first so it wraps everything. It's the same idea as Express middleware. The distinction from filters: middleware is app-wide and only sees the raw `HttpContext`, while filters run inside MVC and know about the action and model state.\n\n## Action results\n\nAn action returns an **action result** that describes the HTTP response. They all derive from `ActionResult` / `IActionResult`, and the `Controller` base class gives you helpers so you rarely construct them directly.\n\n- **Views:** `View()`, `PartialView()`.\n- **Data and status codes:** `Ok()` (200), `CreatedAtAction()` (201), `NoContent()` (204), `BadRequest()` (400), `NotFound()` (404), `Conflict()` (409), `StatusCode()` for anything.\n- **Redirects and files:** `Redirect()`, `LocalRedirect()`, `File()`.\n\nFor Web APIs, prefer **`ActionResult<T>`**, you can return either the value or a result like `NotFound()`, and the success type shows up in the signature for Swagger.\n\n## Model binding and validation\n\n**Model binding** maps request data onto your action parameters automatically, from the route (`[FromRoute]`), the query string (`[FromQuery]`), the body (`[FromBody]`), form fields, or headers. With `[ApiController]` the defaults are smart, so complex types come from the body and simple ones from the route or query.\n\n**Validation** runs after binding using **data annotations** on the model, `[Required]`, `[Range]`, `[EmailAddress]`, and so on. With `[ApiController]`, an invalid model automatically returns a **400** with the errors, before your action runs, so you rarely check `ModelState` yourself. For complex cross-field rules you use `IValidatableObject` or FluentValidation.\n\n## Filters\n\n**Filters** run inside the MVC action pipeline, wrapped around your action, so unlike middleware they can see the action and model state. The types, in order: **authorization**, **resource**, **action** (before and after the action), **exception**, and **result** filters.\n\nYou use them for cross-cutting concerns that are MVC-specific, logging an action, mapping exceptions to responses, caching. The rule of thumb: middleware for truly global concerns like HTTPS and auth, filters for MVC-specific logic.\n\n## Authentication and authorization\n\n**Authentication is who you are; authorization is what you're allowed to do.** Authentication runs first and builds a user with claims, then authorization checks it.\n\n- **Cookies** for server-rendered apps, the browser sends them automatically.\n- **JWT bearer tokens** for APIs and SPAs, a signed, self-contained token in the `Authorization` header, so it's stateless.\n\nFor authorization, **roles** are coarse buckets (`[Authorize(Roles = \"Admin\")]`) and **policies** are richer, reusable rules (`[Authorize(Policy = \"Over18\")]`). Prefer policies for anything beyond a simple role check. Real third-party login layers **OAuth 2.0 / OpenID Connect** on top.",

    test:
"## The test pyramid\n\nThe idea is lots of fast **unit tests** at the base, fewer **integration tests** in the middle, and a few slow **end-to-end tests** at the top.\n\n- **Unit test** tests one class or method in isolation, with its dependencies mocked. Fast, and it pinpoints exactly what broke.\n- **Integration test** tests several parts together for real, for example a service hitting a real or in-memory database, so it catches wiring issues that units miss.\n- **End-to-end** drives the whole system like a user would. Highest confidence, but slow and the most brittle.\n\nIn .NET you'd use **xUnit** (or NUnit). A test follows **Arrange, Act, Assert**, set it up, do the thing, check the result. `[Theory]` with `[InlineData]` runs the same test over many inputs. **TDD** is writing the failing test first, then the code, then refactoring.\n\n## Mocking and testable code\n\nA **mock** is a fake stand-in for a dependency so you can test a class in isolation, without its real database or HTTP calls. You control what the fake returns and you can assert how it was called. In .NET the common library is **Moq**.\n\nThis only works if your class depends on an **interface** rather than a concrete type, which is exactly why dependency injection and interfaces make code testable, you inject a mock in the test and the real thing in production.\n\nThe terms: a **stub** just returns canned data, a **mock** also verifies interactions, and a **fake** is a lightweight working implementation like an in-memory repository. The takeaway is that code that's hard to test is usually too tightly coupled, so testability and good design go together.",

    node:
"## Async and the event loop\n\nNode.js runs your JavaScript on a **single thread**, but it still handles thousands of concurrent connections. The trick is the **event loop** plus **non-blocking I/O**. When you make an I/O call, a database query, an HTTP request, a file read, Node hands it off and keeps going instead of waiting. When the result is ready, a callback is queued and the event loop picks it up.\n\nSo the single thread is almost never blocked waiting on I/O, which is why Node is great for I/O-bound, high-concurrency work like APIs. The flip side: a heavy **CPU-bound** task, a big loop or image processing, blocks that one thread and stalls everything, so you offload those to worker threads or another service.\n\n## Promises and async/await\n\nA **Promise** represents a value that will be ready later; it's either pending, fulfilled, or rejected. `async/await` is syntax on top of promises that lets you write asynchronous code that reads like synchronous code.\n\n- **await** pauses the function until the promise resolves, without blocking the thread.\n- **Promise.all** runs several promises in parallel and waits for all of them, and rejects if any one fails.\n- **Promise.allSettled** waits for all and gives you each result whether it succeeded or failed.\n- **Promise.race** resolves as soon as the first one settles, handy for timeouts.\n\nThe common mistake is awaiting in a loop when the calls are independent; that runs them one after another. Use `Promise.all` to fire them together.\n\n## TypeScript over JavaScript\n\nTypeScript is JavaScript with **static types**. You add types to your variables, parameters, and return values, and the compiler checks them before the code ever runs, so a whole class of bugs, passing the wrong shape, a typo, a possible undefined, gets caught at compile time instead of in production.\n\nYou also get much better tooling, autocomplete, and safe refactoring, and the types act as documentation. It compiles down to plain JavaScript, so it runs anywhere JS runs. For a team and a large codebase, the upfront cost of writing types pays off in fewer runtime surprises.\n\n## Express middleware\n\nIn Express, **middleware** are functions that run in order on every request; each one gets the request, the response, and a `next` function. It can do work, then either call `next()` to pass control on, or send a response and stop the chain.\n\n```js\napp.use((req, res, next) => {\n  console.log(req.method, req.url);\n  next();\n});\n```\n\nOrder matters, they run top to bottom. You use middleware for cross-cutting things like logging, authentication, parsing the body, and error handling. Error-handling middleware is special, it takes four arguments `(err, req, res, next)`.\n\n## TypeORM and repositories\n\nTypeORM is an **ORM** for Node; it maps your TypeScript classes (entities) to database tables so you work with objects instead of raw SQL. A **repository** is the object you use to query and save a given entity.\n\nOne gotcha worth knowing: the `find` method automatically loads related records if you've set up the relations, but the query builder does not, you have to join the relations explicitly with something like `leftJoinAndSelect`. Mixing those up gives you related data that comes back empty, which looks fine in the code and only shows up when you actually run it.",

    behav:
"## How to approach behavioural rounds\n\nBehavioural questions test *how you work* and whether you're a safe, honest hire — they're not trick questions. Two frameworks cover almost everything:\n\n- **STAR** (Situation → Task → Action → Result) for 'tell me about a time…'. Keep Situation/Task short, spend most of your time on **Action** in the first person, and always land a concrete **Result**.\n- **Now → Past → Why here** for 'tell me about yourself': current role, the background that built you, then why *this* role. Aim for ~90 seconds and end on the role, not yourself.\n\n## Principles that carry every answer\n\n- **Never bad-mouth** a current or past employer — frame every move as *toward* something, not away from it.\n- **Be honest about weaknesses** — a real one plus what you're actively doing about it beats a humble-brag every time.\n- **Structure over spontaneity** — rehearse the *beats*, then speak naturally; perfect wording matters less than hitting the beats.\n- **Always have questions to ask** — asking good ones is itself a strong signal you're evaluating them too.\n- **Anchor claims in specifics** — the team of 9, the 3 juniors, the idempotency fix. Concrete beats generic.\n\n## What the cards in this category give you\n\nThe key beats for: tell me about yourself, why leaving, why this role, strengths, weaknesses, leadership, conflict, failure, five-year plan, why-hire-you, salary, questions to ask, and handling pressure. Read them here for the *why*, then switch to **Recall** and rehearse each one out loud.\n\n## Salary — handle it deliberately\n\nDeflect politely if it comes early ('I'd like to understand the scope first'). If pushed, give a **researched range**, anchor on the value you deliver, and know your floor beforehand so you're never talked below it. For a recruiter's first screen, a range is expected — it saves everyone's time.",

    lang:
"## The type system\n\nC#'s types split into two families, and this one distinction explains a huge amount of behaviour.\n\n- **Value types** — `int`, `bool`, `enum`, `struct`, `DateTime`. They hold their data directly. Assigning or passing one **copies the whole value**, so the callee gets an independent copy.\n- **Reference types** — `class`, `string`, `array`, most things. The variable holds a **reference** to an object on the heap. Assigning or passing copies the *reference*, so two variables point at the **same object** — a mutation through one is visible through the other.\n\nThe interview test: *'if I pass it to a method and change it, does the caller see the change?'* Value = no, reference = yes.\n\n## class vs record vs struct\n\n- **class** — reference type, **identity equality** (equal only if the same instance). Your default for anything with behaviour or changing state.\n- **record** — reference type, but the compiler generates **value equality**, `with`-copies and a readable `ToString`. Ideal for immutable data and DTOs.\n- **struct** — value type, copied by value, no heap allocation. For small, short-lived values like a coordinate. Keep them small and ideally immutable.\n\nQuickest tell: two records with identical contents are equal; two classes are only equal if they're the same object.\n\n## Strings\n\n`string` is a **reference type but immutable** — every 'modification' creates a new string. That's why it behaves value-like, and why heavy concatenation in a loop should use `StringBuilder`, which mutates one buffer instead of allocating a new string each iteration.\n\n## var, nullable, const vs readonly\n\n- **var** — compile-time **type inference**, still fully static. `var x = 5` *is* `int x = 5`. Not `dynamic`, not JavaScript's `any`. Use it when the type is obvious on the line.\n- **Nullable reference types** — with the feature on, `string` is non-null and `string?` may be null; the compiler warns if you don't null-check. Catches a class of null-reference bugs at compile time.\n- **const** — compile-time constant, baked into callers, must be a literal. **readonly** — assigned once at runtime (typically in the constructor) and can differ per instance.\n\n## using / IDisposable\n\nA `using` block or declaration guarantees `Dispose()` runs on scope exit **even on exception** — deterministic cleanup for DB connections, files and streams. It's the try/finally you don't have to write.\n\n## Pattern matching\n\nModern C# leans on `is` / `switch` patterns — `if (x is Vehicle v)`, or a `switch` expression with `> 100 => …`. Cleaner than manual casts and null checks, and the compiler can check exhaustiveness.",

    oop:
"## The four pillars\n\n- **Encapsulation** — bundle data with the methods that guard it and hide internals behind a public surface (a property, not a public field), so callers can't put the object in an invalid state and you can add validation later without breaking them.\n- **Abstraction** — expose *what* something does, hide *how*. This is what lets you swap an implementation without touching callers.\n- **Inheritance** — a subclass reuses and extends a base. Useful, but favour **composition** — deep inheritance trees get brittle.\n- **Polymorphism** — one interface, many runtime implementations. It replaces `if`/`switch` chains with a virtual call, which is what makes code Open/Closed.\n\n## SOLID in depth\n\n### S — Single Responsibility\n\nOne reason to change; better framed as *answer to one actor*. If finance, the DBA and HR can each demand a change to the same class, that's three reasons — split it.\n\n```csharp\n// One class, three reasons to change:\nclass BookingService {\n  void Book(BookingRequest r) {\n    // validate    -> rules change\n    // save         -> persistence changes\n    // send email   -> email provider changes\n  }\n}\n// Fix: split into BookingValidator, BookingRepository, EmailNotifier.\n```\n\n### O — Open/Closed\n\nAdd behaviour by writing new code, not editing tested code. The mechanism is almost always **polymorphism replacing a conditional**: a new `IPaymentProcessor` implementation instead of another branch in a payment switch. You pick the axis you expect to vary and stay open on that one.\n\n```csharp\n// Closed: a new type forces an edit to this switch\ndecimal Fee(Payment p) => p.Type switch {\n  PaymentType.Fpx  => ...,\n  PaymentType.Card => ...,\n};\n// Open: add a new class, touch nothing existing\ninterface IPaymentProcessor { bool Handles(PaymentType t); decimal Fee(); }\nclass TngProcessor : IPaymentProcessor { ... }\n```\n\n### L — Liskov Substitution\n\nA subtype must be usable **anywhere** its base is, *behaviourally* — it can't demand more, promise less, throw what the base doesn't, or break invariants. The tell is calling code needing `if (x is SubType)`. Even .NET breaks it: an array is an `IList<T>` that throws on `Add`, which is why `IReadOnlyList<T>` exists.\n\n```csharp\nRectangle r = new Square();\nr.Width = 5; r.Height = 4;\n// caller expects Area == 20; a Square gives 16 -> substitutability broken\n```\n\n### I — Interface Segregation\n\nNo client should depend on methods it doesn't use. `NotImplementedException` in an implementation means the interface is too fat — split it (`IReadRepository` / `IWriteRepository`). It's SRP applied to interfaces.\n\n```csharp\n// Fat: a read-only screen must depend on Delete + BulkImport it never calls\ninterface IRepository<T> { T GetById(int id); void Add(T e); void Delete(T e); void BulkImport(); }\n// Split into focused contracts:\ninterface IReadRepository<T>  { T GetById(int id); }\ninterface IWriteRepository<T> { void Add(T e); void Delete(T e); }\n```\n\n### D — Dependency Inversion\n\nHigh-level policy and low-level detail both depend on an **abstraction owned by the policy side**. `IOrderRepository` lives in the domain; `SqlOrderRepository` in infrastructure points up at it, and the domain doesn't know SQL exists. **DIP is not DI** — Dependency Injection is just a technique to achieve it; you can use a container and still violate DIP by injecting concrete types.\n\n```csharp\n// Coupled to SQL — can't swap or unit-test:\nclass BookingService { SqlBookingRepository _repo = new(); }\n// Inverted: depend on an abstraction, injected:\nclass BookingService {\n  readonly IBookingRepository _repo;\n  BookingService(IBookingRepository repo) => _repo = repo;\n}\n```\n\n## Interface vs abstract class\n\n- **Interface** — a pure contract, no implementation; a class implements as many as it likes. Use it to describe a **capability** (and it's trivial to mock in tests).\n- **Abstract class** — can carry shared implementation alongside abstract members, but you inherit only one. Use it when there's **genuinely shared code**.\n\n## The maturity note\n\nYou can over-apply SOLID: an interface with one implementation that will never have another is just indirection with extra files. Apply it on the axis you actually expect to vary.\n\n## Polymorphism — runtime vs compile-time\n\nThere are two kinds, and interviewers probe the difference:\n\n- **Runtime (overriding)** — the usual meaning. One interface or base, many implementations; which one runs is decided at runtime by the **actual type of the object**, not by the parameters. `INotification.Send()` dispatches to Email or SMS depending on the concrete object the reference holds (dynamic dispatch via a vtable). This is what enables Open/Closed.\n- **Compile-time (overloading)** — same method name, different **parameter signatures**; the compiler picks the overload from the arguments, e.g. `Print(int)` vs `Print(string)`.\n\nTwo things to be precise about:\n- Runtime dispatch depends on the object's **type**, not the parameters. 'Depends on the parameters' describes overloading — a different mechanism.\n- Polymorphism doesn't **eliminate** the if/else that decides which type to build — it moves it to **one place** (a factory or DI) at creation time; every caller that then uses the object is branch-free.\n\n```csharp\n// Runtime: which Send() runs is chosen by n's actual type\nINotification n = factory.Create(channel);  // the ONE decision, here\nn.Send(msg);                                  // dispatches to Email or SMS automatically\n\n// Compile-time: which Print runs is chosen by the argument type\nvoid Print(int n) { }\nvoid Print(string s) { }\n```",

    async:
"## Threads, Tasks, and the pool\n\n- A **Thread** is a real OS thread — roughly a 1MB stack, expensive, and you manage its life.\n- A **Task** is a higher-level promise of future work that runs on the shared **thread pool**; the runtime schedules it. Almost always what you want.\n- ASP.NET Core serves each request on a pool thread, so requests genuinely run in parallel across cores.\n\n## What async/await actually does\n\n`await` on an **I/O** operation (a DB call, an HTTP request) **releases the thread back to the pool** while the I/O is in flight, then resumes your method when the result is ready. The compiler rewrites the method into a **state machine** to make the pause and resume work. `Task` is C#'s Promise; `await` is the pause point, which is why it feels natural coming from Node.\n\n## Throughput, not latency\n\nThis is the line interviewers want: async **improves throughput and scalability, not the speed of any single call.** A 200ms query still takes 200ms — you've just stopped parking a thread on it, so the same pool serves far more concurrent requests. Waiter analogy: taking other tables' orders while the kitchen cooks doesn't make the first meal arrive sooner; it serves more tables per hour.\n\n## async is not multithreading\n\nAsync is about **freeing a thread during a wait**. Multithreading is about **using multiple cores for parallel work**. .NET does both, but they're different: async shines for **I/O-bound** work, while genuine **CPU-bound** parallel work is `Task.Run` / parallelism.\n\n## The gotchas\n\n- **Never** call `.Result` or `.Wait()` on async code — it blocks the very thread you were trying to free and can **deadlock**. Async all the way down.\n- **`async void`** can't be awaited and swallows exceptions (which can crash the process). Only appropriate for event handlers; otherwise return `Task` / `Task<T>`.\n- Because .NET is truly multithreaded, **shared mutable state matters** — which is exactly why `DbContext` is registered **scoped**: it isn't thread-safe, so you never share one across concurrent requests.",

    linq:
"## IEnumerable vs IList vs IQueryable\n\n- **IEnumerable<T>** — the minimum contract: forward-only iteration over an in-memory sequence. LINQ over it runs in your process (**LINQ-to-Objects**). Analogy: a conveyor belt — you can't grab item five or know the count without walking it.\n- **IList<T>** — adds indexing (`list[3]`) and `Count`; a fully materialised in-memory collection. `List<T>` implements it. Analogy: a numbered shelf.\n- **IQueryable<T>** — holds an **expression tree**, not data: a *description* of a query that EF Core translates into **SQL** and runs in the database. Analogy: an order form for the kitchen — nothing's cooked until you send it.\n\nThe classic bug: keep it `IQueryable` so filtering happens in SQL. Call `ToList()` too early and you pull the whole table into memory, then filter in C#.\n\n## Deferred execution\n\nMost operators (`Where`, `Select`, `OrderBy`) are **lazy** — they build a pipeline and run only when you **enumerate** (`foreach`, `ToList`, `Count`, `First`). Two bites:\n\n- **Multiple enumeration** — iterate the same query twice and the work (and the DB round-trip) happens twice. Materialise once with `ToList()` if you'll reuse it.\n- **Captured variables** — the query reads a variable's value at *execution* time, not definition time, which surprises people in loops.\n\n## Collections and Big-O\n\n- **List<T>** — ordered; index access O(1), search by value O(n).\n- **Dictionary<K,V>** — hash lookup, average **O(1)** by key. Reach for it for lookups.\n- **HashSet<T>** — unique membership, O(1) `Contains`.\n- **Queue / Stack** — FIFO / LIFO.\n\nPick the collection by the operation you do most: lookups by key → Dictionary, membership → HashSet, order and iteration → List.",

    data:
"## What EF Core is\n\nThe **ORM** — it maps C# objects to database tables so you write LINQ instead of SQL. Each `DbSet<T>` maps to a table, and the LINQ you write against them becomes SQL.\n\n## DbContext — the heart of it\n\nThree roles: a **unit of work**, a **change tracker**, and the **identity map / gateway** to the database.\n\n- **Change tracking** — load an entity, mutate a property, call `SaveChanges()`; EF diffs against the snapshot it kept and generates the `UPDATE`. On `Add` + `SaveChanges` it issues one `INSERT` in a **transaction** and populates the generated Id.\n- **Lifetime is Scoped (per request)** — it's lightweight, **not thread-safe**, and short-lived. One per HTTP request means all services in that request share one unit-of-work and transaction. Singleton would be a threading disaster and a memory leak, since the tracker would grow forever.\n\n## Migrations (code-first)\n\nVersion your schema from the C# model: `dotnet ef migrations add X` then `dotnet ef database update`. The win — schema changes live in **source control**, are repeatable across environments, and flow through the same pipeline as code. No hand-editing production.\n\n## Loading strategies and N+1\n\n- **Eager** — `.Include(x => x.Owner)` pulls related data up front in one joined query.\n- **Lazy** — fetched on first access; convenient, but the classic cause of **N+1** (load 100 rows, then 100 more queries for each one's children = 101 round-trips).\n- **Explicit** — load on demand with an explicit call.\n- **Projection** — `.Select(...)` exactly what you need.\n\nCatch N+1 by turning on query logging and watching for a burst of identical parameterised queries. Use **`AsNoTracking()`** for read-only queries to skip change-tracking overhead.\n\n## DTO vs entity\n\nDon't leak the database shape to clients. DTOs prevent **over-posting** (a client setting fields it shouldn't) and let you expose only what the API needs — drop internal timestamps, never accept a client-supplied Id.\n\n## Raw SQL, safely\n\nWhen LINQ isn't the tool (a heavy report, an existing stored proc), drop to raw SQL and **always parameterise**: `FromSqlRaw(\"… WHERE Make = {0}\", make)` sends the value as a bound parameter, so injection input is treated as data, not code.",

    sql:
"## ACID and transactions\n\nA **transaction** groups statements into one atomic unit. **ACID** is its four guarantees:\n\n- **Atomicity** — all-or-nothing.\n- **Consistency** — constraints are never left violated.\n- **Isolation** — concurrent transactions don't corrupt each other (to the degree set below).\n- **Durability** — once committed, it survives a crash.\n\nReach for a transaction on any multi-step write that must stay consistent — payments, transfers, issuance.\n\n## Isolation levels and read phenomena\n\nHigher isolation means more correctness and less concurrency:\n\n- **Read Uncommitted** — allows **dirty reads** (seeing uncommitted data).\n- **Read Committed** — prevents dirty reads (the default in SQL Server and Postgres).\n- **Repeatable Read** — rows you've read won't change if you re-read them.\n- **Serializable** — as if transactions ran one at a time.\n\nThe three phenomena: **dirty read** (uncommitted), **non-repeatable read** (a row changed on re-read), **phantom read** (new rows match your `WHERE` on a re-run). Each level up removes one more.\n\n## Indexes\n\nA sorted structure (usually a B-tree) that finds rows without scanning the whole table.\n\n- **Clustered** — defines the physical row order; **one per table** (usually the primary key).\n- **Non-clustered** — a separate structure pointing back to the rows; you can have many.\n- **The trade-off** — fast reads but **slower writes** (every index is maintained on insert/update) and more storage. Index the columns you filter, join and sort on.\n\n## Joins and keys\n\n- **INNER** (matches in both), **LEFT** (all left rows + matches), **FULL** (both sides, nulls where no match). The anti-join *'rows with no match'* = `LEFT JOIN … WHERE right.Id IS NULL`.\n- **Primary key** (unique identity), **foreign key** (referential integrity), **unique constraint** (no duplicates — and a great **idempotency backstop**).\n\n## Normalization vs denormalization\n\nNormalize (1NF / 2NF / 3NF) to remove redundancy so each fact lives in one place and you avoid update anomalies. **Denormalize** deliberately — duplicating data to speed reads in reporting/analytics. It's integrity vs read-performance; choose by workload.\n\n## Concurrency and deadlocks\n\n- **Deadlock** — two transactions each hold a lock the other needs; the DB kills one as the victim. Avoid by accessing rows in a **consistent order**, keeping transactions short, and retrying the victim.\n- **Pessimistic locking** — lock on read (safe, low concurrency). **Optimistic** — a **version/rowversion** column checked at update time (`WHERE Version = @original`; zero rows affected means someone beat you). Optimistic suits rare conflicts, which is most web apps.\n\n## Optimising a slow query\n\nRead the **execution plan** first. Add or fix **indexes** on the WHERE / JOIN / ORDER BY columns, select only the columns you need (no `SELECT *`), avoid functions on indexed columns (`WHERE YEAR(date) = …` can't use the index), and watch for ORM N+1. Cache or denormalise only after the query itself is as tight as it can be.",

    k8s:
"## The model\n\nKubernetes is a **container orchestrator**: you declare **desired state**, and a control loop continuously makes actual state match it.\n\n- **Pod** — the smallest unit; one or more containers sharing a network identity. Disposable.\n- **Deployment** — declares N replicas of an image, replaces dead pods, and handles rolling updates and rollbacks.\n- **Service** — a stable name and virtual IP that load-balances across a changing set of healthy pods.\n- **Ingress** — HTTP routing into Services. **ConfigMap / Secret** — configuration and sensitive values injected into pods.\n\n## Probes\n\n- **Readiness** — 'can it take traffic?' Fail → pulled from Service endpoints (not restarted).\n- **Liveness** — 'is it wedged?' Fail → container **restarted**.\n- **Startup** — holds the other two off for slow-booting apps.\n\nTell: READY 0/1 → readiness; a climbing RESTARTS count → liveness or a crash.\n\n## The diagnostic reflex\n\n`kubectl get pods` (status and READY) → `kubectl describe pod` (Events: scheduling, image pull, secrets, probes) → `kubectl logs --previous` (the app's own crash). Rule of thumb: **container never started → describe; started then failed → logs.**\n\n## Failure states\n\n- **CrashLoopBackOff** — starts then dies repeatedly (bad config, missing env). Use `logs --previous`.\n- **ImagePullBackOff** — can't pull the image (wrong tag or registry auth). Check `describe` Events.\n- **Pending** — can't be scheduled (insufficient CPU/memory, or an unbound volume).\n- **OOMKilled** — hit the **memory** limit and was killed. (Exceeding the **CPU** limit only throttles.)\n- **502 with READY 0/1** — readiness failing → no endpoints → the ingress has nothing to route to. Confirm with `get endpoints` (empty).\n\n## Requests vs limits\n\n**Requests** are the guaranteed minimum the scheduler places the pod on. **Limits** are the hard ceiling — over memory → OOMKilled, over CPU → throttled.\n\n## Rollback and CI/CD\n\n- **Helm** — `helm history` to find the last good revision, `helm rollback` to restore it. In prod, prefer re-deploying the previous good tag through CI so the revert is tracked.\n- **Pipeline** — build (scan, compile, artifact) → dockerize (tag by SHA and branch, push) → deploy (`helm upgrade --install`). SHA tags give traceability and easy rollback targets; gate prod behind a version tag so a production deploy is always deliberate.",

    azure:
"## Compute — pick by control vs convenience\n\n- **App Service** — PaaS for web apps and APIs; deploy code and get scaling plus deployment slots. The default for a standard API.\n- **Azure Functions** — serverless and event-driven; pay-per-execution, scales to zero. Triggers (HTTP, queue, timer, blob) plus bindings.\n- **Container Apps** — serverless containers (managed Kubernetes underneath) with scale-to-zero.\n- **AKS** — managed Kubernetes; the most control and the most complexity.\n\n## Data and storage\n\n- **Azure SQL Database** — managed SQL Server (EF Core code unchanged); DTU vs vCore; a Serverless tier that auto-pauses; Elastic Pools.\n- **Cosmos DB** — globally distributed, multi-model NoSQL; five consistency levels (Strong → Eventual); RU/s throughput.\n- **Blob Storage** — object storage with hot / cool / archive tiers.\n- **Azure Cache for Redis** — in-memory cache for sessions and hot data.\n\n## Messaging\n\n- **Service Bus** — enterprise broker (queues + topics, dead-letter, ordering). The Azure equivalent of RabbitMQ.\n- **Event Hubs** — high-throughput, replayable event streaming. The Azure Kafka.\n- **Event Grid** — lightweight event routing / pub-sub for reactive notifications.\n\n## Security — the secrets answer\n\n- **Key Vault** — a central store for secrets, keys and certificates with access policies and audit logging.\n- **Managed Identity** — an Azure AD identity for your resource so it reaches Key Vault, SQL and Storage **with no stored credentials**. Grant it an RBAC role and the SDK gets tokens transparently — nothing to leak or rotate. This is the modern default over connection strings.\n\n## Ops\n\n- **Application Insights** — APM: requests, dependencies, exceptions, traces, distributed tracing, and KQL queries over the telemetry.\n- **Scaling** — up (a bigger instance) vs **out** (more instances behind a load balancer, the cloud way — needs stateless apps); **autoscale** on metrics or a schedule.\n- **IaC** — **Bicep** / ARM defines resources in version control; Azure DevOps or GitHub Actions pipelines deploy; App Service **slots** give blue-green releases.\n\n## The recency framing (say this honestly)\n\nCertified AZ-204 and AZ-900; your heaviest Azure was a few years back. The service *concepts* — App Service, Functions, Key Vault, the messaging trio, Managed Identity — are current and durable. What needs refreshing is portal and SDK specifics, not the architecture. Frame it as a refresh, not a relearn.",

    design:
"## Message brokers\n\nBoth decouple services, on different models:\n\n- **RabbitMQ** — a traditional broker/queue; a message is delivered and, once acknowledged, it's **gone**. Rich routing. For task and work queues ('process this payment').\n- **Kafka** — an append-only **log**; messages are **retained**, consumers track their own offsets, and it's **replayable**. For high-throughput event streaming, event sourcing and analytics.\n\nRule of thumb: *'do this task' → RabbitMQ; 'this happened, and others may care now or later' → Kafka.*\n\n## At-least-once plus idempotency (the big one)\n\nMost brokers guarantee **at-least-once** delivery — to avoid loss they redeliver anything unacked, so a consumer **will** see duplicates (retries, network blips, redeploys). Therefore the consumer **must be idempotent**: processing the same message twice equals processing it once.\n\nHow: give each message a **stable unique key**; before acting, check a **dedup table / unique constraint**; and do the **check-and-write atomically** in a transaction so two concurrent copies can't both slip through. This is exactly the duplicate-issuance fix — an atomic status transition, not check-then-act.\n\n## Caching\n\nCache hot, expensive-to-compute, rarely-changing data (Redis). The hard parts are **invalidation** and **stampedes**. Common pattern is cache-aside: check the cache, on a miss load from the DB and populate the cache with a TTL.\n\n## Rate limiting and resilience\n\n- **Rate limiting** — protect a service from overload (token bucket, fixed window).\n- **Retry with backoff and jitter**, a **circuit breaker** (stop hammering a failing dependency), **timeouts**, and **idempotency** so retries are safe. Polly is the .NET library for this.\n\n## Monolith vs microservices\n\nA **monolith** is simpler to build, deploy and debug and scales as one unit. **Microservices** give independent deploy/scale and team autonomy but bring real distributed-systems cost — network, consistency, observability. Don't reach for them before the complexity justifies it.\n\n## Designing a payment / issuance flow (your strength)\n\nA payment-gateway callback arrives (at-least-once) → **verify** the callback signature → apply an **idempotency guard** (an atomic claim on the payment id) → issue exactly once → **reconcile** status → **retry/recovery** for failures. The whole thing has to hold up under duplicate callbacks and a concurrent redirect-versus-webhook race.",

    exp:
"## The STAR framework\n\nStructure every experience answer as **Situation → Task → Action → Result**. Keep Situation and Task short (just context), spend most of your time on **Action** — what *you* did, in the first person — and always land a concrete **Result**. Have two or three stories ready that you can flex to different questions: a hard bug, a leadership moment, a conflict.\n\n## Your anchor story: duplicate policy issuance\n\n- **Situation** — on the insurance platform, issuance fired automatically on payment and could be triggered from two places: the async gateway **callback** and the sync **redirect**. Under certain timing both fired, and a few customers got a policy issued twice.\n- **Task** — issue exactly one policy per payment, lose no legitimate issuances, and hold up under at-least-once callbacks (the gateway can legitimately send the same success more than once).\n- **Action** — the root cause was a **read-then-write race**: both flows checked 'issued yet?', saw no, and issued, with nothing atomic between them and no unique constraint. The fix was an **idempotency guard** at the entry point — an **atomic status transition** so the first flow to claim it wins and the second becomes a no-op. I made the webhook handler idempotent too and tested it by firing the callback and redirect simultaneously.\n- **Result** — duplicate issuance was eliminated: one policy per payment even under retries or concurrent callbacks, and it cut the manual cancellations and support tickets. The lesson I now apply by default: for anything money- or issuance-related, make the critical step **idempotent and atomic** — never rely on read-then-write.\n\n## Talking about the team\n\nYou led a **cross-functional team of 9** (dev, BA, QA, DevOps) and mentored **3 junior developers** on production safety and code quality. Frame leadership as lifting the team — coaching on safe, idempotent code and edge-case review — not just shipping your own output.\n\n## The 'why .NET' narrative\n\nYour heaviest hands-on .NET was 2018–2023; recent work is Angular and Node. Two beats: the **fundamentals never left** (OOP, SOLID, async, DI applied daily in TypeScript — a refresh, not a relearn), and it's a **deliberate return** to the strongly-typed, transactional backend work you do best. This isn't a fallback; it's the direction you chose.\n\n## Metrics worth mentioning\n\nA team of 9; 3 juniors mentored; payments across FPX, QR and card via PayNet; the TNG eWallet Mini Program; issuance made safe under retries. Concrete beats vague — reach for the numbers."

"So the main reason is that .NET Framework is Windows-only and basically in maintenance mode now, there are no new features, just security fixes. .NET 8 is the modern unified platform, so you get much better performance which cuts hosting cost, you can run cross-platform on Linux and in containers, and it's a long-term support release so it's a safe target. The way I'd sum it up is, Framework is legacy and Windows-locked, and .NET 8 is faster, cross-platform, cloud-ready, and actively supported.",
"So the quick history is, .NET Framework is the original Windows-only platform, still supported but maintenance-only. Then .NET Core was the cross-platform open-source rewrite. And from .NET 5 onwards they dropped the Core and Framework names and merged everything into just .NET, so 5, 6, 7, and 8 are one line, and .NET 8 is the current long-term support version. And .NET Standard is a spec that both the old and new worlds implement, so a .NET Standard library works on both, which makes it really useful as a bridge during a migration.",
"For a big app I'd go incremental rather than big-bang, because a full rewrite is high-risk and delays value. The pattern is the strangler fig, so you stand the new .NET 8 app up next to the old one, put a proxy like YARP in front, and route traffic to either side. Then you migrate one module at a time and shift the traffic over as each piece is proven, until the old app is fully replaced and you retire it, and the app keeps running the whole time. And there's the .NET Upgrade Assistant and try-convert to automate a lot of the mechanical work.",
"The mechanical retargeting is usually easy, the real blockers are the Framework-only pieces. So System.Web just doesn't exist in modern .NET, WebForms has no migration path and has to be rewritten, and WCF on the server side isn't supported, so you'd move to CoreWCF or to gRPC or REST. Then there's the smaller stuff, Global.asax becomes Program.cs, web.config becomes appsettings.json, HttpModules become middleware, and the old project and package files move to the SDK style. And some third-party packages just won't have a .NET version, so you find replacements. The assessment step is really about finding all of this early so it doesn't blow up the timeline.",

"So the task was a hotel booking system, and instead of building every feature shallowly, I picked one main flow and did it properly and went deep on the hardest part. The stack was React and MUI on the front end, and Node with TypeScript, TypeORM, and SQLite on the back end. The backend is layered, so thin routes that just handle the HTTP, services where the logic lives, and entities for the tables, which keeps the logic in one place and easy to test.",
"The hard part was stopping two people booking the same room for overlapping dates at the same time, which is a race condition. So I layered the solution, a lock so only one check-and-write runs at a time, a transaction so it's all-or-nothing, an overlap check as the source of truth, and an idempotency key so a repeated request returns the original booking. One wins with a 201 and the rest get a 409, and I proved it by firing five requests at once, one booked and four got 409.",

"There are four. Encapsulation is hiding an object's state behind a public surface so nobody can put it into an invalid state. Abstraction is exposing what something does while hiding how it does it. Inheritance is one class deriving from a base, though I usually favour composition over deep inheritance. And polymorphism is the same call behaving differently depending on the runtime type — which is really what lets you replace big if-else chains with a clean virtual call.",
"SOLID is five principles that all come down to changing code safely. Single responsibility — a class should have one reason to change. Open-closed — you extend behaviour by adding new code rather than editing what already works. Liskov — a subtype has to behave correctly anywhere its base is used. Interface segregation — don't force a client to depend on methods it doesn't use. And dependency inversion — both the high-level policy and the low-level detail depend on an abstraction that the policy side owns, so for example my domain defines the repository interface and the SQL implementation depends on it, not the other way round. And I'd add that dependency inversion isn't the same as dependency injection — DI is just one technique for achieving it.",
"I use an interface when I'm describing a capability and there might be several implementations — and a nice bonus is that it's easy to mock in tests. I reach for an abstract class when there's genuinely shared code, like a base payment gateway with common logging and one abstract Charge method that each concrete gateway fills in. The practical difference is you can implement many interfaces, but you can only inherit one class.",
"One thing I've learned is that you can over-apply SOLID. An interface with a single implementation that's never going to have another is really just indirection with extra files. So I apply it on the axis I actually expect to change, rather than everywhere by reflex.",
"There are actually two kinds of polymorphism. The runtime one is what people usually mean — the same interface with many implementations, and which one runs is decided at runtime by the actual type of the object, not by the parameters. So an INotification's Send dispatches to email or SMS depending on the concrete object I'm holding. The compile-time kind is method overloading — same name, different parameter types, and the compiler picks which one. And I'm careful to say polymorphism doesn't delete the if-else that decides which type to build — it just moves it to one place, a factory or DI, and every caller after that is branch-free."

    async: [
"A Thread is an actual operating-system thread — it's expensive, and you manage its lifecycle yourself. A Task is a higher-level promise of future work that runs on the shared thread pool, and the runtime schedules it — so that's almost always what I reach for. And ASP.NET Core handles each request on a pool thread, so requests genuinely run in parallel across cores.",
"Async-await is about not blocking a thread while you wait on I/O, like a database or an HTTP call. When I await, the thread is released back to the pool to serve other requests, and my method resumes once the data's ready. Task is basically C#'s version of a Promise, and await is the pause point — which is why it felt very natural coming from Node.",
"The key thing is that async improves throughput, not the speed of any single call. A query that takes two hundred milliseconds still takes two hundred milliseconds — I've just stopped tying up a thread while it runs, so the same pool can serve far more concurrent requests. It's like a waiter taking other tables' orders while the kitchen cooks — the first meal doesn't arrive any sooner, but you serve a lot more tables in an hour.",
"It's worth separating async from multithreading, because they're not the same thing. Async is about freeing a thread during a wait, so it's really for I/O-bound work. Multithreading is about using multiple cores for parallel work. .NET does both, but I keep them distinct in my head.",
