<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A keyboard-driven C#/.NET interview study tool — say-it-out-loud recall cards plus MCQ quiz, with spaced repetition.">
<title>C# Drill — Interview Recall</title>
<style>
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #f6f5fa;
    --surface: #ffffff;
    --surface-2: #efedf6;
    --ink: #1b1a24;
    --muted: #6b6880;
    --faint: #948fa8;
    --line: #e4e1ee;
    --accent: #6d4aff;
    --accent-strong: #512bd4;
    --accent-soft: #ece7ff;
    --good: #2f9e69;
    --good-soft: #e3f3ea;
    --warn: #cf8a2c;
    --warn-soft: #f7ecd9;
    --bad: #d1495b;
    --bad-soft: #f7e2e5;
    --shadow: 0 1px 2px rgba(27,26,36,.04), 0 12px 34px -18px rgba(45,32,90,.28);
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", "SF Mono", "Segoe UI Mono", Consolas, Menlo, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100f16;
      --surface: #191823;
      --surface-2: #201e2c;
      --ink: #ece9f5;
      --muted: #9a95b0;
      --faint: #6a6680;
      --line: #2a2836;
      --accent: #9d86ff;
      --accent-strong: #7c5cff;
      --accent-soft: #241f38;
      --good: #4bbd86;
      --good-soft: #16261f;
      --warn: #e0a24e;
      --warn-soft: #29200f;
      --bad: #e56b7c;
      --bad-soft: #2a161b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f5fa; --surface: #ffffff; --surface-2: #efedf6; --ink: #1b1a24;
    --muted: #6b6880; --faint: #948fa8; --line: #e4e1ee; --accent: #6d4aff;
    --accent-strong: #512bd4; --accent-soft: #ece7ff; --good: #2f9e69; --good-soft: #e3f3ea;
    --warn: #cf8a2c; --warn-soft: #f7ecd9; --bad: #d1495b; --bad-soft: #f7e2e5;
    --shadow: 0 1px 2px rgba(27,26,36,.04), 0 12px 34px -18px rgba(45,32,90,.28);
  }
  :root[data-theme="dark"] {
    --bg: #100f16; --surface: #191823; --surface-2: #201e2c; --ink: #ece9f5;
    --muted: #9a95b0; --faint: #6a6680; --line: #2a2836; --accent: #9d86ff;
    --accent-strong: #7c5cff; --accent-soft: #241f38; --good: #4bbd86; --good-soft: #16261f;
    --warn: #e0a24e; --warn-soft: #29200f; --bad: #e56b7c; --bad-soft: #2a161b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -20px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: var(--accent-soft); }

  /* ── Header ─────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 900px; margin: 0 auto;
    padding: 14px 22px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .wordmark {
    font-family: var(--mono);
    font-weight: 700; font-size: 15px; letter-spacing: -.02em;
    color: var(--ink); white-space: nowrap;
  }
  .wordmark .dot { color: var(--accent); }
  .wordmark .cur { color: var(--accent); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .spacer { flex: 1 1 auto; }

  .seg {
    display: inline-flex; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 9px; padding: 3px;
  }
  .seg button {
    font-family: var(--mono); font-size: 12px; letter-spacing: .01em;
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 13px; border-radius: 7px; cursor: pointer;
    transition: color .15s, background .15s;
  }
  .seg button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .seg button:hover { color: var(--ink); }

  select.cat {
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px; cursor: pointer;
  }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--muted); cursor: pointer; transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ── Progress strip ─────────────────────────────────── */
  .strip {
    max-width: 900px; margin: 0 auto; width: 100%;
    padding: 0 22px;
  }
  .strip-inner {
    display: flex; align-items: center; gap: 18px;
    padding: 10px 0 0; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .track {
    flex: 1 1 160px; height: 5px; border-radius: 3px;
    background: var(--surface-2); overflow: hidden; min-width: 120px;
  }
  .track > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s ease; }
  .stat b { color: var(--ink); font-weight: 700; }
  .stat .u { color: var(--faint); }

  /* ── Main ───────────────────────────────────────────── */
  main {
    flex: 1 1 auto; width: 100%;
    max-width: 900px; margin: 0 auto;
    padding: 22px 22px 40px;
    display: flex; flex-direction: column;
  }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow);
    padding: 30px clamp(22px, 5vw, 44px);
    display: flex; flex-direction: column; min-height: 62vh;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise .32s cubic-bezier(.2,.7,.2,1); }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  .card-top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .chip {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent-strong);
    background: var(--accent-soft); border-radius: 999px;
    padding: 5px 11px; font-weight: 600;
  }
  .mastery { display: inline-flex; gap: 5px; align-items: center; margin-left: auto; }
  .mastery .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
  .mastery .pip.on { background: var(--accent); border-color: var(--accent); }
  .mastery small { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-left: 4px; letter-spacing: .04em; }

  .prompt {
    font-family: var(--mono);
    font-size: clamp(19px, 2.6vw, 25px);
    line-height: 1.4; font-weight: 600; letter-spacing: -.01em;
    color: var(--ink); text-wrap: balance; margin: 0 0 4px;
  }
  .say {
    font-family: var(--sans); font-size: 13px; color: var(--muted);
    margin-top: 16px; display: flex; align-items: center; gap: 8px;
  }
  .say svg { width: 15px; height: 15px; color: var(--accent); flex: none; }

  .grow { flex: 1 1 auto; }

  /* ── Reveal / answer ────────────────────────────────── */
  .answer {
    margin-top: 24px; border-top: 1px dashed var(--line); padding-top: 22px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .answer { animation: fade .3s ease; }
  }
  @keyframes fade { from { opacity: 0; } }
  .answer .lbl {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 10px;
  }
  .prose { font-family: var(--serif); font-size: 16.5px; line-height: 1.62; color: var(--ink); }
  .prose p { margin: 0 0 12px; }
  .prose p:last-child { margin-bottom: 0; }
  .prose strong { font-weight: 700; }
  .prose code {
    font-family: var(--mono); font-size: .84em;
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 1px 5px; border-radius: 5px; color: var(--accent-strong);
  }
  .prose pre {
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    background: var(--surface-2); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 13px 15px; margin: 4px 0 14px;
    overflow-x: auto; color: var(--ink);
  }
  .prose pre code { background: none; border: 0; padding: 0; color: inherit; font-size: 13px; }
  .prose ul.notes { margin: 2px 0 14px; padding-left: 1.2em; }
  .prose ul.notes > li { margin: 0 0 9px; padding-left: 4px; }
  .prose ul.notes > li::marker { color: var(--accent); }
  .prose ul.sub { margin: 7px 0 7px; padding-left: 1.1em; list-style: none; }
  .prose ul.sub > li { margin: 0 0 5px; color: var(--muted); font-size: .93em; position: relative; }
  .prose ul.sub > li::before { content: "\2013"; position: absolute; left: -1em; color: var(--faint); }
  .prose .note-h { text-wrap: balance; }
  .prose .note-h2 {
    font-family: var(--mono); font-size: 14px; letter-spacing: .01em; font-weight: 700;
    color: var(--accent-strong); margin: 26px 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  }
  .prose .note-h3 {
    font-family: var(--sans); font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
    font-weight: 600; color: var(--muted); margin: 18px 0 7px;
  }
  .notes-doc > .note-h2:first-child { margin-top: 0; }
  .notes-doc { font-size: 15.5px; }
  .notes-doc p { margin: 0 0 11px; }
  .stats-group { display: contents; }
  .stats-note { color: var(--muted); }
  .note-count {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    color: var(--faint); letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  /* Notes flip: front = study notes, back = spoken talking point. */
  @media (prefers-reduced-motion: no-preference) {
    .flip-face { animation: flipIn .34s cubic-bezier(.2,.7,.2,1); transform-origin: center left; }
  }
  @keyframes flipIn { from { opacity: 0; transform: perspective(900px) rotateY(-16deg); } to { opacity: 1; transform: none; } }

  .spoken-face { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; min-height: 38vh; }
  .say-lbl {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent-strong); font-weight: 600; margin-bottom: 16px;
  }
  .say-lbl svg { width: 14px; height: 14px; flex: none; }
  .spoken-text {
    margin: 0; font-family: var(--serif); font-size: clamp(18px, 2.4vw, 21px); line-height: 1.72;
    color: var(--ink); max-width: 62ch;
  }
  .spoken-text strong { font-weight: 700; }
  .spoken-text code { font-family: var(--mono); font-size: .85em; }

  .flip-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .flip-btn svg { width: 15px; height: 15px; flex: none; }
  .btn .hint { opacity: .7; font-family: var(--mono); font-size: 12px; }
  .note-nav { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
  .btn.nav-prev { color: var(--muted); }
  .btn.nav-prev:disabled { opacity: .4; cursor: default; }
  .btn.nav-prev:disabled:hover { border-color: var(--line); }

  /* Skip nav — jump between cards in Recall/Quiz without answering. */
  .skip-nav {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .skip-nav .btn { font-size: 13px; padding: 8px 13px; color: var(--muted); }
  .skip-nav #skip-prev { justify-self: start; }
  .skip-nav #skip-next { justify-self: end; }
  .skip-nav .btn:disabled { opacity: .4; cursor: default; }
  .skip-nav .btn:disabled:hover { border-color: var(--line); }
  .skip-pos {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    letter-spacing: .04em; font-variant-numeric: tabular-nums; text-align: center;
  }

  /* ── Controls ───────────────────────────────────────── */
  .controls { margin-top: 26px; }
  .btn {
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    padding: 13px 20px; border-radius: 11px; cursor: pointer;
    transition: transform .12s, border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    width: 100%; font-size: 15px; letter-spacing: .01em;
  }
  :root[data-theme="dark"] .btn.primary,
  .btn.primary { color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #14121c; } }
  :root[data-theme="dark"] .btn.primary { color: #14121c; }
  :root[data-theme="light"] .btn.primary { color: #fff; }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grade button {
    font-family: var(--sans); font-weight: 600; font-size: 14px;
    border-radius: 11px; padding: 13px 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: transform .12s, border-color .15s, background .15s;
  }
  .grade button:active { transform: translateY(1px); }
  .grade button .k { font-family: var(--mono); font-size: 10px; color: var(--faint); font-weight: 400; }
  .grade .got:hover { border-color: var(--good); background: var(--good-soft); }
  .grade .got { color: var(--good); }
  .grade .shk:hover { border-color: var(--warn); background: var(--warn-soft); }
  .grade .shk { color: var(--warn); }
  .grade .mis:hover { border-color: var(--bad); background: var(--bad-soft); }
  .grade .mis { color: var(--bad); }

  /* ── Quiz choices ───────────────────────────────────── */
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .choice {
    text-align: left; font-family: var(--sans); font-size: 15px; color: var(--ink);
    border: 1px solid var(--line); background: var(--surface); border-radius: 11px;
    padding: 13px 15px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
    transition: border-color .15s, background .15s;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice .key {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  .choice.correct { border-color: var(--good); background: var(--good-soft); }
  .choice.correct .key { border-color: var(--good); color: var(--good); }
  .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .choice.wrong .key { border-color: var(--bad); color: var(--bad); }
  .choice:disabled { cursor: default; }
  .explain {
    margin-top: 16px; font-family: var(--serif); font-size: 15.5px; line-height: 1.6;
    color: var(--ink); background: var(--surface-2); border-radius: 10px;
    padding: 14px 16px; border-left: 3px solid var(--accent);
  }
  .explain strong { font-weight: 700; }
  .explain code { font-family: var(--mono); font-size: .85em; background: var(--surface); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; color: var(--accent-strong); }

  /* ── Footer ─────────────────────────────────────────── */
  footer {
    max-width: 900px; margin: 0 auto; width: 100%;
    padding: 4px 22px 28px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11px; color: var(--faint);
  }
  footer kbd {
    font-family: var(--mono); font-size: 10px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--muted);
  }
  .link {
    background: none; border: 0; color: var(--faint); font-family: var(--mono);
    font-size: 11px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    padding: 0;
  }
  .link:hover { color: var(--bad); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  @media (max-width: 560px) {
    .bar { padding: 12px 16px; gap: 10px; }
    .strip, main, footer { padding-left: 16px; padding-right: 16px; }
    .card { padding: 24px 18px; min-height: 60vh; }
    .grade button .full { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="wordmark">csharp<span class="dot">.</span>drill<span class="cur">_</span></span>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Study mode">
      <button id="mode-notes" aria-pressed="false">Notes</button>
      <button id="mode-recall" aria-pressed="true">Recall</button>
      <button id="mode-quiz" aria-pressed="false">Quiz</button>
    </div>
    <select class="cat" id="cat" aria-label="Category filter"></select>
    <button class="icon-btn" id="theme" aria-label="Toggle theme" title="Toggle theme"></button>
  </div>
  <div class="strip">
    <div class="strip-inner">
      <span id="stats-progress" class="stats-group">
        <span class="stat"><b id="s-mastered">0</b><span class="u"> / <span id="s-total">0</span> mastered</span></span>
        <span class="stat">deck <b id="s-pos">0</b><span class="u">/<span id="s-deck">0</span></span></span>
        <div class="track" aria-hidden="true"><i id="bar"></i></div>
        <span class="stat">streak <b id="s-streak">0</b></span>
      </span>
      <span id="stats-notes" class="stats-note" style="display:none"></span>
    </div>
  </div>
</header>

<main>
  <div class="card" id="card"><!-- rendered --></div>
</main>

<footer>
  <span id="fkeys"></span>
  <span class="spacer" style="flex:1"></span>
  <button class="link" id="reset">reset progress</button>
</footer>

<script>
(function () {
  "use strict";

  /* ════════════════════════════════════════════════════════
     QUESTION BANK  — seeded from Zulhilmi's interview prep.
     Grow it: add objects to RECALL or QUIZ.
     Answer/explain markup: **bold**, `inline code`, ```code block```
     ════════════════════════════════════════════════════════ */

  var CATS = {
    finago: "Hotel Booking Case",
    behav: "Behavioral & Fit",
    lang:  "C# Language",
    oop:   "OOP & SOLID",
    async: "Async & Threading",
    linq:  "LINQ & Collections",
    data:  "EF Core & ORM",
    aspnet:"ASP.NET Core & Web API",
    test:  "Testing & Quality",
    node:  "Node & TypeScript",
    mig:   ".NET Modernization & Migration",
    sql:   "SQL & Databases",
    k8s:   "Kubernetes & DevOps",
    azure: "Azure & Cloud",
    design:"System Design",
    exp:   "Experience & STAR"
  };

  var RECALL = [
    { id:"f-walkthrough", cat:"finago",
      prompt:"Walk me through what you built, and why you structured it that way. (opener)",
      a:"So the task was to build a hotel-booking system. Instead of trying to build every single feature, I picked one main flow and did it properly, and focused on the hardest part.\n\nFor the tech stack, I used React with MUI for the frontend. For the backend I used Node with TypeScript, with TypeORM and SQLite for the database.\n\nFor the structure, the backend is split into layers. So I have the **routes**, which just handle the requests coming in. Then the **services**, which is where the actual logic sits. And then the **entities**, which is basically the database tables. So the main logic all sits in the services, which makes it easier to test. And for the frontend, I split it by feature, so each part like search, booking, calendar, front desk, and loyalty has its own folder.\n\nFor the features, on the customer side we have room search by date and category, and a booking flow with a few steps and validation. On the staff side we have a front desk page to see the bookings and room history, a calendar to see availability, and a loyalty page to see the top customers. I also built a partner API so third-party booking sites can book through our system.\n\nBut the main part, and the hardest one, is preventing double-booking, so two people can't book the same room at the same time. That's where I spent most of my time, so I can walk you through that if you want." },

    { id:"f-doublebook", cat:"finago",
      prompt:"What happens when two people book the same room, same dates, at the same time? Walk me through it.",
      a:"I'll start with the problem we usually have for any booking application. There might be a time where multiple people try to book the same room, at the same time, with the same dates, so what happens then? Without proper handling, we'd get a double-booking issue.\n\nSo to solve this, what I implemented is that whenever the `createReservation` function is called, it calls a `withLock` function. This `withLock` is a mutual exclusion, or a mutex, which forces multiple requests to run one at a time. So only one request gets to check and write at a time, and that's how one wins the race.\n\nWithin that same request, I also wrapped everything in a transaction, so any failure can be rolled back. This is common for relational databases, for example the SQLite we use here, it follows the ACID principle, Atomicity specifically, which is all-or-nothing: on success it commits, and on any failure it rolls back to the previous state.\n\nInside the same request I also have an idempotency check using an idempotencyKey. What it does is check whether any request has already claimed that key in the table. If it finds the same key was already used, it stops there and returns the original booking. If not, it continues.\n\nThen, before writing the booking, it runs an overlap check. It queries for any existing active reservation on that room whose dates overlap the requested range. The rule is: an existing booking clashes if its check-in is before my check-out, and its check-out is after my check-in. So if there's any overlap, it's a clash and I reject with a `409`. If there's no overlap, I write the booking and return a `201`. One detail here, I use a strict less-than, so it's a half-open interval, which means someone checking out on the 10th and someone checking in on the 10th don't falsely collide.\n\nI tested this using a simple script I wrote in the `test-concurrency.js` file. We can run it with `node test-concurrency.js`. What it does is fire multiple requests at the exact same time using the `Promise.all` function, to simulate multiple people booking at once, all hitting the reservation endpoint. For the successful booking we see a `201`, and for the rest we see a `409`.\n\nFor this case study this is sufficient. But for a production release I'd move the lock to the database level, because in production we'd likely have multiple instances or pods running, and the in-memory lock only holds within a single instance, so each pod would have its own lock, which wouldn't stop a double-booking across pods. At the database level I'd use something like a Postgres serializable transaction, a `SELECT FOR UPDATE` per room, or an exclusion constraint on the date range." },

    { id:"f-datamodel", cat:"finago",
      prompt:"How did you design your data model, and why?",
      a:"So for the data model, the main tables are RoomType, Room, Customer, Reservation, and an AuditLog.\n\nThe way they connect: a RoomType is the category, like single, double, or suite. Each type has many Rooms under it, and a Room is the actual physical room, like 247. Then the Reservation is the main table, it's the actual booking, so it links a Room and a Customer together for a check-in and check-out date. A Customer is the guest, and they can have many reservations. So basically everything centers on the Reservation table.\n\nThere's also an AuditLog, a separate table that records every event, like a booking being created or cancelled. It's append-only, so I never edit or delete it, and that's what powers the room-history view for the staff.\n\nFor the design choices, a few things I did on purpose. First, I store money as a whole number in cents, not a decimal, because floats can cause rounding errors with money. A classic example is that in most languages, 0.1 plus 0.2 doesn't give exactly 0.3, it gives 0.30000000000000004, because floats store numbers as binary approximations. Over many transactions those tiny errors add up and your totals stop reconciling. So I store money as integer cents instead, because integers are exact, so RM250 is stored as 25000, and I only convert to ringgit for display. Second, a guest can book a specific room like 247, or just any room of a category like a double. But either way the reservation always points to one physical room, so for a category booking I just pick an available room of that type and assign it. And third, all the personal data, the name, email, phone, sits in the Customer table on its own, so if I needed to add encryption or access control later, there's just one place to do it." },

    { id:"f-aiusage", cat:"finago",
      prompt:"Which parts did you write yourself vs with AI, and how did you verify the AI code?",
      a:"So I built this with AI assistance, and the important part is where the AI helped and where I had to own it myself.\n\nThe AI was really good for the plumbing, so scaffolding the basic CRUD endpoints, wiring up the forms, and the boilerplate. But the core of the system, the double-booking prevention, that's a concurrency problem and it carried the real risk, so I designed and wrote that part myself.\n\nFor verifying the AI code, my rule is I treat it like a pull request from a junior developer, useful, but I never just trust it. So I read every line and make sure I can explain what it does. If I can't explain it, it doesn't go in. Then I test it, especially the important parts. For the double-booking, I wrote a script that fires multiple bookings at the same time to prove only one wins.\n\nAnd a real example, in this project the AI generated a database query that looked correct when I read it, but when I ran it, the related data came back empty. The reason is how the ORM loads related records. There are two ways to fetch data in TypeORM: there's the simple `find` method, which automatically loads the related records like the room and the customer, and there's the query builder, which is more manual and doesn't do that automatically, you have to explicitly join the relations yourself. The AI used the query builder but expected the automatic loading, so the room came back as null. It looked fine in the code, I only caught it because I tested the endpoint and saw the data come back empty, not from reading it. So that's exactly why I always test it, not just read it." },

    { id:"f-partner", cat:"finago",
      prompt:"You built a third-party/partner API. How did you secure it?",
      a:"So the case mentioned bookings can come from third-party booking sites, not just the website. So I built a separate partner API for that, under `/api/partner`, and I secured it in a few ways.\n\nFirst, authentication. Each partner gets an API key, but I don't store the actual key, I only store a hash of it, using SHA-256. So even if the database leaked, nobody could use it to impersonate a partner. It's the same idea as storing password hashes.\n\nSecond, rate limiting. Each partner has a limit on how many requests they can make, so one partner can't flood the API. I used a token bucket, so each partner gets a bucket of tokens, each request uses one, and the bucket refills over time. If they run out, they get a `429`.\n\nThird, and this is the nice part, the partner bookings go through the exact same booking logic as the website. So the double-booking protection still applies across channels. If a partner and the website try to book the same room at the same time, still only one wins, because the database is the single source of truth.\n\nAnd a partner can only see their own bookings, not everyone's." },

    { id:"f-tradeoffs", cat:"finago",
      prompt:"What tradeoffs did you consider?",
      a:"A few tradeoffs I made on purpose.\n\nFirst, I used SQLite instead of a bigger database like Postgres. For a case study it's zero setup and easy to run. The tradeoff is SQLite doesn't have some features Postgres has, like an exclusion constraint that could enforce no overlapping bookings at the database level, so I handle that in the app instead. On Postgres I'd push it into the database.\n\nSecond, for the locking, I used an in-app lock, which is correct for a single instance. The tradeoff is it doesn't work across multiple servers, so at scale I'd move it to the database level.\n\nThird, I let TypeORM auto-create the schema, which is called synchronize. It's great for a demo, but in production I'd use migrations instead, so schema changes are tracked and reversible.\n\nAnd the biggest one, I chose depth over breadth. Instead of building every feature halfway, I focused on one solid flow and went deep on the hardest part. The case actually said we're not expected to build everything, so that was deliberate." },

    { id:"f-moretime", cat:"finago",
      prompt:"What would you do differently, or add, with more time?",
      a:"A few things I'd do with more time.\n\nFirst, I'd move the double-booking guarantee into the database using Postgres, so it works across multiple instances, either with a serializable transaction, a row lock, or an exclusion constraint on the date range.\n\nSecond, I'd add authentication and roles, so the staff pages are properly protected and separated from the customer side. Right now they're just different tabs.\n\nThird, real-time availability, so the calendar updates live if someone else books, using something like websockets.\n\nFourth, proper tests, unit tests for the booking and overlap logic, and putting the concurrency test into a CI pipeline.\n\nAnd a few smaller things, encrypting the personal data at rest, and splitting the frontend bundle so it loads faster." },

    { id:"f-features", cat:"finago",
      prompt:"Walk me through the other features (search, booking flow, calendar, staff, loyalty).",
      a:"Besides the booking core, here are the other features quickly.\n\nFor search, the customer picks a date range and a category, and I show the available rooms. Behind that, the query finds all rooms that don't have an overlapping booking for those dates, so it filters out anything taken.\n\nThe booking flow is multi-step, so the customer enters their details, reviews, then confirms, with validation on each step, like checking the email format before they can continue.\n\nThe calendar is a grid of rooms across dates, showing at a glance which rooms are booked on which days.\n\nThe front desk page has an overview at the top, today's occupancy, arrivals, and departures, then the list of bookings and the room history.\n\nAnd the loyalty page ranks customers by how much they've spent, using a grouped query that sums each customer's total and assigns a tier like Silver or Gold." },

    { id:"f-aisafe", cat:"finago",
      prompt:"How do you ensure AI-generated code is safe and correct?",
      a:"Sure. My basic rule is I treat AI-generated code like a pull request from a junior developer, it speeds me up, but I never just trust it and merge it. My process has a few steps.\n\nFirst, it starts before the AI writes anything, I make sure I have a clear spec and I've framed the problem properly, because if the input is vague, you get code that looks right but is subtly wrong.\n\nSecond, I read every line and make sure I can explain what it does and why. If I can't explain it, it doesn't go in.\n\nThird, I check it against the actual requirement and the edge cases, not just the happy path, so does it handle the failure cases, the empty inputs, the race conditions.\n\nFourth, I test it, especially the risky parts, because reading isn't enough, some bugs only show up when you run it. In a recent project the AI wrote a query that looked correct but returned empty data, and I only caught it by running it, not by reading it.\n\nAnd fifth, I'm specifically watching for what AI tends to get wrong, security like injection or leaked secrets, error handling, and edge cases, and for the highest-risk logic I write it myself instead of letting the AI own it.\n\nSo AI is my accelerator for the routine work, but the judgment, the spec, the review, and the testing, stays with me. That's what keeps it safe and correct." },

    { id:"f-idempotency", cat:"finago",
      prompt:"What's an idempotency key, and how is it different from the double-booking race?",
      a:"So these are two different problems that people often mix up.\n\nThe double-booking race is when two different people try to book the same room at the same time. They're different requests, and I handle that with the lock and the overlap check, so only one wins and the other gets a 409.\n\nIdempotency is a different thing. It's when the same person's request gets sent twice, like a double-click, or the network times out and the client retries. Both requests carry the same idempotency key, because it's the same booking attempt. So the first one creates the booking and stores the key, and the second one sees the key already exists and just returns the original booking, instead of creating a duplicate.\n\nSo idempotency is about the same request being sent twice, and the double-booking race is about two different requests fighting over the same room. In my code, the idempotency check is inside the same lock, so even if two retries with the same key come in at the exact same moment, they're handled one at a time and still resolve to one booking. And there's a unique constraint on the key in the database as a final backstop.\n\nOne honest note on where the key comes from: it's sent by the client in the request body. In this case study the backend supports it and I tested it via the API, but I didn't wire the web frontend to generate one yet, so it's mainly there for API clients that retry." },

    { id:"f-eager", cat:"finago",
      prompt:"TypeORM: how do find() and the query builder differ on loading related records? (the bug you caught)",
      a:"So the bug I caught was about how TypeORM loads related records, and there's an important difference between the two ways to query.\n\nThe `find` method respects eager relations, so it loads them automatically. If my Reservation entity marks room and customer as eager, find gives them back already loaded:\n\n```typescript\n// find() auto-loads the eager relations (room, customer)\nconst reservations = await reservationRepo.find({\n  where: { status: 'confirmed' },\n})\n// reservations[0].room and .customer are populated\n```\n\nThe query builder is more manual and ignores eager, so you have to join the relations yourself. This was the bug, the AI wrote this and expected room to be loaded, but it came back null:\n\n```typescript\n// query builder IGNORES eager -> r.room is undefined\nconst reservations = await reservationRepo\n  .createQueryBuilder('r')\n  .where('r.status = :status', { status: 'confirmed' })\n  .getMany()\n```\n\nThe fix is to explicitly join the relations:\n\n```typescript\n// explicitly load the relations\nconst reservations = await reservationRepo\n  .createQueryBuilder('r')\n  .leftJoinAndSelect('r.room', 'room')\n  .leftJoinAndSelect('r.customer', 'customer')\n  .where('r.status = :status', { status: 'confirmed' })\n  .getMany()\n```\n\nSo the takeaway: find respects eager and auto-loads relations, the query builder ignores eager and you have to leftJoinAndSelect them yourself. And I only caught it by testing, because the code looked fine on read." },

    { id:"f-promise", cat:"node",
      prompt:"What's the difference between a Promise and `Promise.all`?",
      a:"A Promise represents a single asynchronous operation that will finish in the future, it either resolves with a value or rejects with an error, and you get the result with `await` or `.then`.\n\n`Promise.all` is different, it takes an array of promises and runs them all at the same time, in parallel, then waits for all of them to finish. It resolves once every promise has resolved, giving you an array of all the results. If any one of them rejects, `Promise.all` rejects immediately.\n\nSo a single Promise is one async task, and `Promise.all` is for running many async tasks at once and waiting for all of them. In my concurrency test I used `Promise.all` to fire multiple booking requests at the exact same time to simulate the race.\n\nOne tip: if you have independent async calls, running them with `Promise.all` is much faster than awaiting them one by one in a loop, because they run in parallel instead of sequentially. Two related ones: `Promise.allSettled` also waits for all of them but doesn't reject if some fail, it gives you the status of each, and `Promise.race` resolves as soon as the first one finishes." },

    { id:"f-async", cat:"node",
      prompt:"What is async/await and how does it work in Node?",
      a:"async/await is a cleaner way to work with promises, it lets you write asynchronous code that reads top to bottom like normal code, instead of chaining `.then` callbacks.\n\nWhen you `await` something like a database call or an HTTP request, the function pauses at that point and hands control back to Node, so Node can go handle other work while it waits. When the result is ready, the function resumes. So it doesn't block the thread, which matters because Node is single-threaded.\n\nA couple of details: any function marked `async` automatically returns a promise, and you handle errors with a normal try/catch around the `await`, which is much nicer than callback-style error handling." },

    { id:"f-eventloop", cat:"node",
      prompt:"Node is single-threaded, so how does it handle many requests at once?",
      a:"Node runs your JavaScript on a single thread, but it uses an event loop with non-blocking I/O. So when you do something like a database call, Node doesn't sit and wait, it hands the I/O off, keeps serving other requests, and comes back to that one when the result is ready.\n\nSo even though it's one thread, it can handle thousands of concurrent connections, as long as the work is mostly I/O-bound, like waiting on databases or APIs, which most web apps are.\n\nThe thing to watch out for is heavy CPU work, because that blocks the single thread. For that you'd offload to a worker thread or a separate service." },

    { id:"f-typeorm", cat:"node",
      prompt:"What is TypeORM, and what's a repository?",
      a:"TypeORM is an ORM, an object-relational mapper, for Node and TypeScript. It maps my TypeScript classes, called entities, to database tables, so I can work with objects instead of writing raw SQL.\n\nA repository is the main way you interact with a table. So I get the repository for an entity, like the Reservation repository, and it gives me methods like `find`, `save`, and `createQueryBuilder` to read and write that table. It handles turning my objects into SQL and back.\n\nAnd an ORM in general just saves you writing repetitive SQL and keeps your data access typed and consistent, though for complex queries you sometimes still drop to the query builder or raw SQL." },

    { id:"f-typescript", cat:"node",
      prompt:"Why TypeScript over plain JavaScript?",
      a:"TypeScript is JavaScript with static typing added on top. So I declare the types of my variables, function parameters, and return values, and the compiler checks them before the code even runs.\n\nThe main benefit is catching a whole class of bugs at compile time instead of at runtime, like passing the wrong type or a typo in a property name. It also makes the code more self-documenting and gives much better autocomplete and refactoring in the editor.\n\nIt compiles down to plain JavaScript to actually run, so it's really a development-time safety net. And coming from C#, the type system felt very familiar." },

    { id:"f-middleware", cat:"node",
      prompt:"What is middleware in Express?",
      a:"Middleware is a function that runs in between receiving a request and sending the response. It gets the request and response objects and a `next` function, and it can either do something and pass control on by calling `next`, or stop the request and respond itself.\n\nI used middleware for the partner API: one for authentication that checks the API key and either attaches the partner or rejects with a `401`, and one for rate limiting that checks the token bucket and either allows the request or returns a `429`.\n\nSo middleware is great for cross-cutting concerns like auth, logging, and rate limiting, because it runs before your actual route handler, in one place, instead of repeating it in every route." },

    { id:"asp-actionresult", cat:"aspnet",
      prompt:"ActionResult, IActionResult, ActionResult<T> — what are they and why return them?",
      a:"They're the objects an MVC / Web API action returns to describe the HTTP response. Everything derives from the abstract **`ActionResult`**, which implements the **`IActionResult`** interface.\n\n- **`IActionResult`** — the interface. Use it as your return type when one action can return **different** results (a view in one branch, a 404 in another).\n- **`ActionResult`** — the abstract base class implementing it.\n- **`ActionResult<T>`** — Web API generic: return **either** a value **or** an action result, with better typing. `public ActionResult<Booking> Get(int id)` can `return booking;` or `return NotFound();`.\n\nYou rarely `new` these up — the `Controller` base class gives helper methods (`View()`, `Json()`, `Ok()`, `NotFound()`, `CreatedAtAction()`) that build them for you. The point of the abstraction: the framework runs whatever result you hand back, so one method can flexibly return HTML, JSON, a redirect, or a status code." },

    { id:"asp-viewresults", cat:"aspnet",
      prompt:"View-rendering results — ViewResult, PartialViewResult, ViewComponentResult?",
      a:"These render HTML from Razor (server-rendered MVC, not Web APIs).\n\n- **`ViewResult`** — `View(model)` renders a full Razor view to HTML.\n- **`PartialViewResult`** — `PartialView()` renders just a fragment, e.g. for an AJAX update.\n- **`ViewComponentResult`** — `ViewComponent()` renders a reusable widget with its own logic (a mini-controller for a cart summary, nav menu, etc.).\n\n```csharp\npublic IActionResult Details(int id) => View(model);\n```\n\nAll three come from `Controller` base-class helpers." },

    { id:"asp-apiresults", cat:"aspnet",
      prompt:"Web API action results that map to HTTP status codes — the common ones?",
      a:"The bread-and-butter for APIs; each maps to a status code:\n\n- **`Ok(obj)`** → `OkObjectResult`, **200** with a body.\n- **`CreatedAtAction(...)`** → **201** plus a `Location` header (return after a successful create).\n- **`NoContent()`** → **204**, success with no body.\n- **`BadRequest(obj)`** → **400**, e.g. `return BadRequest(ModelState);`.\n- **`NotFound()`** → **404**.\n- **`Unauthorized()`** → **401**, **`Forbid()`** → **403**.\n- **`Conflict(obj)`** → **409** (the double-booking case).\n- **`StatusCode(429, obj)`** → any code you want.\n- **`Json(obj)`** → `JsonResult`; **`Content(text)`** → raw string.\n\n```csharp\n[HttpPost]\npublic IActionResult Create(BookingDto dto)\n{\n    if (!ModelState.IsValid) return BadRequest(ModelState); // 400\n    if (RoomTaken(dto))      return Conflict(\"Room taken\");  // 409\n    var b = _service.Book(dto);\n    return CreatedAtAction(nameof(Get), new { id = b.Id }, b); // 201\n}\n```\n\nThe `*ObjectResult` variants (`OkObjectResult`, `NotFoundObjectResult`) are just the with-a-body versions of the plain ones." },

    { id:"asp-redirectfile", cat:"aspnet",
      prompt:"Redirect and file action results in ASP.NET Core?",
      a:"**Redirects:**\n- **`Redirect(url)`** → `RedirectResult`, 302 to a raw URL.\n- **`RedirectToAction(\"Index\")`** → redirect to another action.\n- **`RedirectToRoute(...)`** → redirect by named route.\n- **`LocalRedirect(\"/home\")`** → redirect only within your own site; blocks open-redirect attacks (won't send users to an external URL).\n\n**Files:**\n- **`File(bytes, contentType)`** → `FileContentResult`, send a `byte[]`.\n- **`File(stream, contentType)`** → `FileStreamResult`, stream it.\n- **`PhysicalFile(path, type)`** → send from an absolute disk path.\n- **`File(\"~/x\", type)`** → `VirtualFileResult`, send from a wwwroot / virtual path.\n\nUse `LocalRedirect` over `Redirect` for any user-supplied return URL — it's the safe default." },

    { id:"asp-iactionresult-vs-t", cat:"aspnet",
      prompt:"IActionResult vs ActionResult<T> — which should a Web API action return? (common follow-up)",
      a:"Both let an action return different responses; the difference is **typing**.\n\n**`IActionResult`** — you return only action results (`Ok(obj)`, `NotFound()`). The success payload type isn't visible in the signature, so Swagger/OpenAPI can't infer it without an extra `[ProducesResponseType]` attribute.\n\n**`ActionResult<T>`** — you can return **either** a `T` **directly** or an action result, and the success type `T` is right there in the signature. Cleaner, self-documenting, and tooling picks up the response shape automatically.\n\n```csharp\npublic ActionResult<Booking> Get(int id)\n{\n    var b = _repo.Find(id);\n    if (b is null) return NotFound(); // 404\n    return b;                         // implicitly 200 + JSON\n}\n```\n\nRule of thumb: **prefer `ActionResult<T>` for Web API** actions that return data; use plain `IActionResult` when there's no single payload type (only status codes)." },

    { id:"asp-middleware", cat:"aspnet",
      prompt:"The ASP.NET Core middleware pipeline — what is it and how does ordering work?",
      a:"Middleware are components chained together to process every HTTP request. Each one can do work, then either call `next()` to pass the request along, or **short-circuit** and return a response itself. The request flows down the chain and the response flows back up, so it's often drawn as a pipeline (or an onion).\n\nYou wire it up in `Program.cs`:\n\n```csharp\napp.UseExceptionHandler();\napp.UseHttpsRedirection();\napp.UseAuthentication();   // must come before UseAuthorization\napp.UseAuthorization();\napp.MapControllers();\n```\n\n**Order matters** — each piece runs in the order you register it, so authentication must precede authorization, and exception handling goes first so it wraps everything. A custom one:\n\n```csharp\napp.Use(async (ctx, next) => {\n    // before: runs on the way in\n    await next();\n    // after: runs on the way out\n});\n```\n\n`Use` calls the next middleware; `Run` is terminal (no next). Same idea as Express middleware, just in C#." },

    { id:"asp-auth", cat:"aspnet",
      prompt:"Authentication vs Authorization in ASP.NET Core — JWT vs cookies, roles vs policies?",
      a:"**Authentication = who are you; Authorization = what are you allowed to do.** Authentication runs first and builds a `ClaimsPrincipal` (the user plus their claims); authorization then checks it.\n\n**How the identity is carried:**\n- **Cookies** — the server sets an auth cookie after login and the browser sends it automatically. Good for server-rendered apps; stateful-ish, needs CSRF protection.\n- **JWT (bearer token)** — a signed token the client sends in the `Authorization: Bearer ...` header. Stateless and self-contained (claims live inside it), ideal for APIs and SPAs/mobile. The server just validates the signature, no lookup needed.\n\n**Authorization styles:**\n- **Roles** — coarse buckets: `[Authorize(Roles = \"Admin\")]`.\n- **Policies** — richer, requirement-based rules: `[Authorize(Policy = \"Over18\")]`, defined once and reusable. Prefer policies for anything beyond a simple role check.\n- **Claims** — key/value facts about the user that a policy can inspect.\n\nFor real third-party login you layer **OAuth 2.0 / OpenID Connect** on top (delegated access plus identity), which is what \"Sign in with Google/Microsoft\" uses." },

    { id:"oop-interface-abstract", cat:"oop",
      prompt:"Interface vs abstract class — when do you use each?",
      a:"**Interface** — a pure contract: method/property signatures, no state, no constructor. A class can implement **many** interfaces. Use it to say \"this type can *do* X\" (`IDisposable`, `IComparable`), especially for dependency injection and testing, where you code against the interface and swap implementations.\n\n**Abstract class** — a partial base: it can have **state (fields), constructors, and shared implementation** alongside abstract members. A class can inherit only **one**. Use it when related types share real code and a common identity, and you want to force subclasses to fill in specific pieces.\n\nOne line: *interface = a capability many unrelated types can have; abstract class = a shared base for closely related types.* When unsure, prefer an interface — it's more flexible and testable. (Modern C# interfaces can carry default method bodies, which blurs this a little, but the state and single-inheritance distinctions still hold.)" },

    { id:"oop-patterns", cat:"oop",
      prompt:"Common design patterns — name a few and when you would use them.",
      a:"Reusable solutions to recurring design problems. The ones that come up most:\n\n- **Singleton** — one shared instance app-wide (config, a cache). In .NET you usually get this via DI `AddSingleton` rather than the classic static pattern.\n- **Factory** — encapsulate object creation so callers don't `new` concrete types directly; good when the type to create depends on input.\n- **Repository** — hide data access behind an interface (`IOrderRepository`) so business logic doesn't know about EF/SQL. (EF's `DbSet` is already a repository, so don't blindly over-wrap it.)\n- **Strategy** — swap an algorithm at runtime behind an interface (different pricing or shipping rules); favours composition over `if/else` chains.\n- **Observer** — publish/subscribe; one change notifies many listeners. C# `event`s are this built in.\n- **Decorator** — wrap an object to add behaviour (logging, caching) without changing it; the same thinking as middleware.\n\nRule of thumb: reach for a pattern when it *removes* real duplication or coupling, not to show you know patterns." },

    { id:"lang-delegates", cat:"lang",
      prompt:"Delegates, Func/Action, and events — what are they?",
      a:"A **delegate** is a type-safe reference to a method — a variable that holds a function you can pass around and call later. It's how C# does first-class functions.\n\n```csharp\ndelegate int Op(int a, int b);\nOp add = (a, b) => a + b;\nint r = add(2, 3); // 5\n```\n\nYou rarely declare your own now, because the framework provides:\n- **`Func<...>`** — a delegate that **returns** a value; the last type parameter is the return type: `Func<int,int,int>` takes two ints, returns an int.\n- **`Action<...>`** — a delegate that returns **void**: `Action<string>`.\n- **`Predicate<T>`** — returns `bool` (used by filter-style methods).\n\nAn **event** is a delegate wrapped with publish/subscribe semantics: outsiders can only `+=`/`-=` to subscribe, not invoke or overwrite it. It's the built-in Observer pattern, used for notifications and callbacks." },

    { id:"lang-lambda-closure", cat:"lang",
      prompt:"Lambdas and closures — what are they, and what is the closure gotcha?",
      a:"A **lambda** is an inline anonymous function: `x => x * 2`. It's just a compact way to create a delegate (or an expression tree for `IQueryable`).\n\nA **closure** is when a lambda *captures* a variable from its surrounding scope and keeps it alive beyond that scope:\n\n```csharp\nint factor = 10;\nFunc<int,int> mul = x => x * factor; // captures 'factor'\n```\n\nThe gotcha: a closure captures the **variable, not its value at the moment of creation**. The classic bug is capturing a loop variable:\n\n```csharp\nvar actions = new List<Action>();\nfor (int i = 0; i < 3; i++)\n    actions.Add(() => Console.Write(i));\n// older C#: prints 3 3 3, not 0 1 2\n```\n\nbecause every lambda shares the same `i`. Fix: copy into a local inside the loop (`var local = i;`). Modern C# fixed this for `foreach`, but the principle — closures capture variables by reference — is the point." },

    { id:"lang-exceptions", cat:"lang",
      prompt:"Exception handling in C# — try/catch/finally, custom exceptions, best practices?",
      a:"`try` runs risky code, `catch` handles specific failures (most specific first), `finally` **always** runs — success or failure — for cleanup.\n\n```csharp\ntry { Process(); }\ncatch (IOException ex) when (ex.HResult == -1) { ... } // filter\ncatch (Exception ex) { log.Error(ex); throw; }         // rethrow\nfinally { stream.Dispose(); }\n```\n\n**Best practices:**\n- **Catch specific types, not `Exception`** — except at a top-level boundary that logs everything.\n- **Rethrow with `throw;` not `throw ex;`** — bare `throw` preserves the original stack trace.\n- **Don't swallow** exceptions silently (empty catch).\n- Use **`when` filters** to branch without catching.\n- **Custom exceptions** derive from `Exception` for domain errors (`RoomUnavailableException`) so callers can catch them precisely.\n- **Don't use exceptions for normal control flow** — they're expensive; reserve them for the genuinely exceptional.\n- `using` / `try-finally` for guaranteed resource cleanup." },

    { id:"lang-nullable", cat:"lang",
      prompt:"Nullable reference types and the null operators (?, ??, ?., !) — what do they do?",
      a:"**Nullable reference types** (C# 8+, opt-in) make the compiler track nullability. `string` means *shouldn't be null*; `string?` means *can be null*. The compiler then warns you when you might dereference a null, catching NullReferenceExceptions at compile time instead of runtime.\n\nThe operators:\n- **`?`** on a type — *nullable*: `string? name`, `int?` (which is `Nullable<int>` for value types).\n- **`?.`** null-conditional — access only if not null, otherwise the whole expression is null: `user?.Address?.City`.\n- **`??`** null-coalescing — fallback: `name ?? \"Unknown\"`.\n- **`??=`** — assign only if currently null: `name ??= \"Unknown\"`.\n- **`!`** null-forgiving — \"trust me, it's not null\": `user!.Name`. It suppresses the warning; use sparingly, because you're overriding the compiler's safety check.\n\nTogether they turn null handling from a runtime surprise into something the compiler helps you get right." },

    { id:"lang-generics", cat:"lang",
      prompt:"Generics and constraints — what problem do they solve?",
      a:"**Generics** let you write a class or method that works over **any type** while staying fully type-safe — no casting, no boxing. `List<T>`, `Dictionary<TKey,TValue>`, `Repository<T>` are all generic.\n\n```csharp\nT Max<T>(T a, T b) where T : IComparable<T>\n    => a.CompareTo(b) > 0 ? a : b;\n```\n\nWithout generics you'd fall back to `object` and cast everywhere (unsafe, and it boxes value types). With generics the compiler knows the real type.\n\n**Constraints** (`where T : ...`) restrict what `T` can be, so you can actually *use* it:\n- `where T : class` / `struct` — reference or value type.\n- `where T : IComparable<T>` — must implement an interface (so you can call its members).\n- `where T : new()` — must have a parameterless constructor (so you can `new T()`).\n- `where T : BaseClass` — must derive from a base.\n\nConstraints are what let a generic method do more than just store the value." },

    { id:"lang-pattern-matching", cat:"lang",
      prompt:"Pattern matching and switch expressions — what are they?",
      a:"Pattern matching tests the *shape* of a value and extracts from it in one step — far cleaner than chained `if`/casts.\n\n- **Type pattern:** `if (shape is Circle c) return c.Radius;` — tests and casts together.\n- **Switch expression** — returns a value; each arm is `pattern => result`:\n\n```csharp\ndecimal fee = customer switch {\n    { Tier: \"Platinum\" } => 0m,      // property pattern\n    { Orders: > 10 }     => 5m,      // relational pattern\n    null                 => throw new ArgumentNullException(),\n    _                    => 10m      // discard = default\n};\n```\n\n- **Relational** (`> 10`), **logical** (`and`/`or`/`not`), **property** (`{ Tier: ... }`), and **positional** (deconstruct a record/tuple) patterns can all combine.\n\nIt makes branching logic declarative, and the compiler warns if you miss a case. Very common in modern C#, and often a \"do you keep up with the language\" signal." },

    { id:"lang-boxing", cat:"lang",
      prompt:"Boxing and unboxing — what are they and why care?",
      a:"**Boxing** = wrapping a **value type** (int, struct) in an object so it can live on the heap and be treated as a reference type. **Unboxing** = extracting it back out with a cast.\n\n```csharp\nint n = 42;\nobject o = n;      // boxing: allocates on the heap, copies the value\nint back = (int)o; // unboxing\n```\n\nWhy care: boxing **allocates memory and adds GC pressure**. In a hot loop it's a real performance cost. It used to happen constantly with non-generic collections (`ArrayList` holds `object`), which is a big reason **generics exist** — `List<int>` stores ints directly, no boxing.\n\nThe interview tell: \"why is `List<int>` better than an `ArrayList` of ints?\" → because `ArrayList` boxes every int. Watch for accidental boxing whenever a value type is assigned to `object` or a non-generic interface." },

    { id:"lang-gc-dispose", cat:"lang",
      prompt:"Garbage collection, IDisposable, and using — how does memory cleanup work in C#?",
      a:"C# is **managed**: the **garbage collector** automatically frees heap objects that are no longer reachable, so you don't `free()` manually. It's **generational** (gen 0/1/2), collecting short-lived objects cheaply and often.\n\nBut the GC only knows about **managed memory**. It doesn't know when to release **unmanaged** resources — file handles, DB connections, sockets. That's what **`IDisposable`** is for: a `Dispose()` method you call to release those deterministically.\n\n**`using`** guarantees `Dispose()` runs, even on exception:\n\n```csharp\nusing var conn = new SqlConnection(cs); // disposed at end of scope\n```\n\nKey points:\n- **Dispose is deterministic; GC is not** — you control *when* with `using`, but not when the GC runs.\n- A **finalizer** (`~Class`) is a last-resort backstop for unmanaged cleanup if `Dispose` was never called, but it delays collection, so prefer `IDisposable` + `using`.\n- Common leaks *despite* GC: undetached **event handlers**, static references, and long-lived caches keeping objects reachable." },

    { id:"data-loading", cat:"data",
      prompt:"EF Core: eager vs lazy vs explicit loading of related data?",
      a:"Three ways to pull in related entities (a `Reservation`'s `Room` and `Customer`):\n\n- **Eager** — load them up front in the query with `Include`:\n  ```csharp\n  db.Reservations.Include(r => r.Room).ThenInclude(rm => rm.Type)\n  ```\n  One round trip, explicit — the usual default.\n- **Lazy** — the related data loads **automatically on first access** to the navigation property. Convenient, but it's the main cause of the **N+1 problem** (a hidden query per row in a loop), and it needs proxies enabled. Use with caution.\n- **Explicit** — load on demand later: `db.Entry(res).Reference(r => r.Room).Load()`. You control exactly when.\n\nThis is the direct C# parallel to the **TypeORM bug** from my case: `find()` auto-loaded relations but the query builder didn't unless I joined them explicitly — the same eager-vs-manual distinction. Rule: prefer eager `Include` for known needs, avoid lazy loading in loops, and keep an eye on your query count." },

    { id:"data-tracking", cat:"data",
      prompt:"EF Core change tracking and AsNoTracking — what and when?",
      a:"By default EF Core **tracks** every entity a query returns: it keeps a snapshot so that when you call `SaveChanges()`, it knows what changed and generates the right UPDATEs. That's how `SaveChanges` works without you calling an explicit update.\n\nTracking has a cost — memory and CPU to snapshot and diff every row. For **read-only queries** (a list you'll just display, never save), use **`AsNoTracking()`**:\n\n```csharp\nvar rooms = db.Rooms.AsNoTracking().ToList();\n```\n\nIt skips the tracking overhead and is noticeably faster on large read sets. Rule of thumb: **track when you'll modify and save; `AsNoTracking` for pure reads.**\n\nRelated: the `DbContext` is **Scoped** (one per request) partly because its change tracker is stateful and not thread-safe — sharing it across requests would leak tracked entities. And schema changes go through **migrations** (`Add-Migration` / `Update-Database`), the reviewable, reversible alternative to `synchronize`-style auto-create." },

    { id:"test-types", cat:"test",
      prompt:"Testing: unit vs integration vs e2e, and how do you write tests in .NET?",
      a:"**The test pyramid** — many fast unit tests at the base, fewer integration tests, a few slow end-to-end tests at the top.\n- **Unit test** — one class/method in **isolation**, dependencies mocked. Fast, pinpoints the failure.\n- **Integration test** — several parts together **for real** (e.g. a service hitting a real or in-memory database); catches wiring issues units miss.\n- **End-to-end** — the whole system through the UI/API as a user would. Highest confidence, slowest, most brittle.\n\n**In .NET** you use **xUnit** (or NUnit/MSTest). A test is Arrange-Act-Assert:\n\n```csharp\n[Fact]\npublic void Overlap_SameDates_IsDetected() {\n    var svc = new BookingService(...);   // Arrange\n    var clash = svc.HasOverlap(a, b);     // Act\n    Assert.True(clash);                   // Assert\n}\n```\n\n`[Theory]` + `[InlineData]` runs the same test over many inputs. **TDD** is the discipline of writing the failing test first, then the code, then refactoring. Good speaking point: in my hotel booking case I'd unit-test the overlap logic and add a concurrency integration test in CI." },

    { id:"test-mocking", cat:"test",
      prompt:"Mocking and testable code — what is a mock and why does DI matter for testing?",
      a:"A **mock** is a fake stand-in for a dependency, so you can test a class **in isolation** without its real database, HTTP call, or clock. You control what the fake returns and assert how it was called.\n\nWith **Moq**:\n```csharp\nvar repo = new Mock<IRoomRepository>();\nrepo.Setup(r => r.Find(1)).Returns(room);       // stub a return\nvar svc = new BookingService(repo.Object);\nsvc.Book(1);\nrepo.Verify(r => r.Save(It.IsAny<Booking>()), Times.Once); // assert interaction\n```\n\nThis only works if the class **depends on an interface**, not a concrete type — which is exactly why **dependency injection + interfaces** make code testable: you inject a mock in the test and the real thing in production.\n\nTerms you may be asked: a **stub** returns canned data; a **mock** also verifies interactions; a **fake** is a lightweight working implementation (like an in-memory repo). Takeaway: *code that's hard to test is usually too tightly coupled — testability and good design go together.*" },

    { id:"linq-collections", cat:"linq",
      prompt:"The main collections — List, Array, Dictionary, HashSet, Queue, Stack — when each?",
      a:"- **`Array`** — fixed size, contiguous, fastest index access. Use when the size is known and stable.\n- **`List<T>`** — resizable array, the everyday default for an ordered sequence you add to. O(1) append (amortised), O(n) search or insert-in-the-middle.\n- **`Dictionary<TKey,TValue>`** — hash map, **O(1)** average lookup/insert by key. The default for \"look something up by id\". Unordered.\n- **`HashSet<T>`** — unique values, **O(1)** `Contains`. Use for membership/dedup (\"have I seen this?\").\n- **`Queue<T>`** — FIFO, `Enqueue`/`Dequeue`. Order of arrival (job processing).\n- **`Stack<T>`** — LIFO, `Push`/`Pop`. Undo, recursion-style work.\n- **`SortedDictionary` / `SortedSet`** — kept in key order, O(log n).\n\nInterview reflex: **need fast lookup by key → Dictionary; need uniqueness/contains → HashSet.** Using `List.Contains` inside a loop (O(n²)) when a `HashSet` would make it O(n) is a classic thing they probe." },

    { id:"linq-first-single", cat:"linq",
      prompt:"First vs FirstOrDefault vs Single vs SingleOrDefault (and Select vs SelectMany)?",
      a:"All fetch one element; they differ on how many they expect and what happens when there's **none**:\n\n- **`First`** — returns the first match; **throws** if there are none.\n- **`FirstOrDefault`** — returns the first match, or **default (null/0)** if none. Use when \"none\" is a valid case.\n- **`Single`** — expects **exactly one**: throws if none **and** throws if more than one. Great for lookup by primary key — it asserts uniqueness.\n- **`SingleOrDefault`** — returns the one match, or default if none, but still **throws if more than one**.\n\nSo: `First*` = \"at least one, give me the first\"; `Single*` = \"there should be exactly one\"; the `*OrDefault` variants tolerate zero and return default instead of throwing (then you null-check).\n\n**Select vs SelectMany:** `Select` maps each item to one result (giving a list-of-lists if each item yields a collection); **`SelectMany` flattens** — each item yields a collection and they're concatenated into one flat sequence. Use `SelectMany` to project a one-to-many into a single list." },

    { id:"async-deadlock", cat:"async",
      prompt:"The .Result / .Wait() deadlock, and ConfigureAwait(false) — what is going on?",
      a:"**Blocking on async code can deadlock.** Calling `.Result` or `.Wait()` on a Task blocks the current thread until it finishes. If that thread is the one the async continuation needs to resume on (a UI thread, or the classic ASP.NET request context), you get a **deadlock**: the continuation waits for the thread, the thread waits for the continuation.\n\n```csharp\nvar x = GetAsync().Result; // can deadlock in some contexts\n```\n\n**Rule: async all the way down** — `await` instead of blocking; don't mix the two.\n\n**`ConfigureAwait(false)`** tells the await \"I don't need to resume on the original context — any thread-pool thread is fine.\" In **library code** this avoids the deadlock and is a small perf win:\n```csharp\nawait SomethingAsync().ConfigureAwait(false);\n```\nYou add it in libraries; in app code (especially modern ASP.NET Core, which has no sync context) it matters less — but knowing *why* it exists is the interview point." },

    { id:"async-cancellation", cat:"async",
      prompt:"CancellationToken, and Task.WhenAll / WhenAny — what are they for?",
      a:"**`CancellationToken`** is the standard way to **cooperatively cancel** async work — a timed-out request, a user who navigated away. You pass a token down the call chain; the work periodically checks it and bails out cleanly.\n\n```csharp\npublic async Task<Data> GetAsync(CancellationToken ct) {\n    var res = await http.GetAsync(url, ct);   // cancels the HTTP call\n    ct.ThrowIfCancellationRequested();\n    return Parse(res);\n}\n```\nASP.NET Core hands you `HttpContext.RequestAborted` automatically. It's *cooperative* — nothing is force-killed; the code has to observe the token.\n\n**Composing tasks:**\n- **`Task.WhenAll(t1, t2, ...)`** — await **all** in parallel; completes when the slowest finishes. Great for firing independent calls at once (the C# equivalent of `Promise.all`).\n- **`Task.WhenAny(...)`** — completes when the **first** finishes; use for timeouts or first-response-wins.\n\nNote: `WhenAll` only runs things concurrently if you start the tasks *before* awaiting — don't `await` each one in a loop." },

    { id:"async-threadsafe", cat:"async",
      prompt:"Thread safety — lock, Interlocked, and concurrent collections?",
      a:"When multiple threads touch shared mutable state, you get **race conditions** — the same core problem as the double-booking in my hotel booking case, just in-process. Tools, cheapest first:\n\n- **`lock`** — the everyday mutex; only one thread at a time in the block:\n  ```csharp\n  lock (_gate) { _balance += amount; }\n  ```\n  Lock on a private `readonly object`, never on `this` or a public object. Keep the critical section tiny.\n- **`Interlocked`** — lock-free atomic operations for simple counters: `Interlocked.Increment(ref _count)`. Faster than a lock for a single operation.\n- **Concurrent collections** — `ConcurrentDictionary`, `ConcurrentQueue`, etc. are built to be used safely from many threads without your own locking.\n- **`SemaphoreSlim`** — like a lock but supports **async** (`await sem.WaitAsync()`), since you can't `await` inside a `lock`.\n\nInterview link: my in-app mutex was the single-instance version of this; across servers you'd push the guarantee into the database. Same problem, different scope." },

    { id:"design-caching", cat:"design",
      prompt:"Caching — the cache-aside pattern, Redis, and invalidation?",
      a:"Caching stores expensive-to-compute or frequently-read data somewhere fast to cut latency and database load. **Redis** (in-memory, distributed) is the usual choice so every app instance shares one cache.\n\n**Cache-aside** (the common pattern):\n1. Check the cache. **Hit** → return it.\n2. **Miss** → load from the DB, put it in the cache with a **TTL**, return it.\n\n```csharp\nvar room = await cache.GetAsync(key)\n           ?? await LoadAndCache(key);\n```\n\n**The hard part is invalidation** (\"one of the two hard problems in CS\") — keeping the cache from serving stale data after the source changes:\n- **TTL / expiry** — simplest; accept a small staleness window.\n- **Write-through / evict-on-write** — update or delete the cache entry when the data changes.\n\nAlso know: a **local (in-memory) cache** is fastest but per-instance and can go stale across servers; a **distributed cache** (Redis) is shared but adds a network hop. And beware the **cache stampede** — when a hot key expires and every request hits the DB at once." },

    { id:"design-resilience", cat:"design",
      prompt:"Resilience patterns — retry, circuit breaker, timeout (and Polly)?",
      a:"In distributed systems, dependencies fail or slow down; resilience patterns stop one failure from cascading. In .NET these come from **Polly** (and the newer `Microsoft.Extensions.Resilience`).\n\n- **Retry** — a transient failure? try again, ideally with **exponential backoff + jitter** so you don't hammer a struggling service. Only retry **idempotent** operations, or you double-book (literally, in my case).\n- **Circuit breaker** — after N consecutive failures, **stop calling** the dependency for a cooldown and fail fast, giving it time to recover instead of piling on. Then it half-opens to test the waters.\n- **Timeout** — never wait forever; cap the call so a slow dependency doesn't exhaust your threads.\n- **Bulkhead** — isolate resources (separate connection pools) so one overloaded dependency can't sink the whole app.\n- **Fallback** — return a default or cached value when the call fails.\n\n```csharp\nPolicy.Handle<HttpRequestException>()\n      .WaitAndRetryAsync(3, n => TimeSpan.FromSeconds(Math.Pow(2, n)));\n```\n\nInterview link: retry and idempotency go together — which is exactly why my booking used an idempotency key." },

    { id:"design-clean-arch", cat:"design",
      prompt:"Layered / clean architecture — what is it and why bother?",
      a:"The idea: separate code into **layers with a one-way dependency rule**, so business logic doesn't depend on infrastructure.\n\nA typical layering:\n- **Domain / Core** — entities and business rules. Depends on nothing.\n- **Application** — use cases, service interfaces, orchestration.\n- **Infrastructure** — EF Core, HTTP clients, the file system — the concrete implementations.\n- **Presentation** — API controllers / UI.\n\n**Clean/Onion architecture** adds the **dependency-inversion** twist: dependencies point **inward**, toward the domain. Outer layers depend on inner ones, never the reverse. The domain defines an `IRoomRepository` **interface**; infrastructure implements it. So you can swap the database or framework without touching business rules, and you can test the core in isolation.\n\nMy hotel booking backend was a lighter version of this: **thin routes → services (logic) → entities**, with routes depending on services, not the other way round. The payoff: the interesting logic lives in one place, testable and framework-agnostic. The cost: more indirection — so match the ceremony to the size of the project." },

    { id:"design-micro-mono", cat:"design",
      prompt:"Microservices vs monolith (and API gateway / service discovery)?",
      a:"**Monolith** — one deployable app. Simpler to build, test, deploy, and debug; one database, no network hops between modules. The downside shows up at scale: the whole thing deploys together, and one team's change can ripple into others.\n\n**Microservices** — many small services, each owning its data and deployed independently. Benefits: independent scaling and deployment, team autonomy, fault isolation. Costs: **distributed-system complexity** — network calls fail, cross-service data consistency is hard (no distributed transaction; you use eventual consistency / sagas), plus monitoring and DevOps overhead.\n\nSupporting pieces worth naming:\n- **API gateway** — one entry point that routes to services and centralises auth, rate limiting, TLS.\n- **Service discovery** — services find each other dynamically instead of via hard-coded addresses.\n- **Async messaging** (Kafka/RabbitMQ) to decouple services.\n\nThe senior take: **start with a well-structured monolith** and split out services only when a real scaling or team-boundary need appears. \"Microservices\" is an answer to an organisational/scaling problem, not a default." },

    { id:"design-cqrs", cat:"design",
      prompt:"CQRS and event sourcing — what are they and when?",
      a:"**CQRS (Command Query Responsibility Segregation)** — separate the **write** model (commands that change state) from the **read** model (queries that return data), instead of one model doing both. They can have different shapes, or even different databases: a normalised write store and a denormalised, fast read store.\n\nWhy: reads and writes often have very different needs (complex reads, high read volume). Splitting them lets you optimise and scale each independently. The cost is more moving parts and often **eventual consistency** between the two sides. Overkill for simple CRUD; valuable for complex domains or lopsided read/write loads. In .NET, **MediatR** is commonly used to route commands and queries.\n\n**Event sourcing** (often paired, but a separate idea) — instead of storing current state, store the **sequence of events** that produced it (`BookingCreated`, `BookingCancelled`). Current state is a replay of those events. You get a full audit log and time-travel for free, at the cost of complexity and needing projections to query.\n\nInterview note: my append-only **AuditLog** is event-sourcing-*flavoured* — every booking change recorded as an event — though I still kept current state in the reservation table." },

    { id:"asp-model-binding", cat:"aspnet",
      prompt:"Model binding in ASP.NET Core — what is it and where does the data come from?",
      a:"Model binding automatically maps incoming HTTP request data onto your action parameters or model objects, so you never parse the request by hand. It pulls from several **sources** and converts the raw strings to your types.\n\nSources and their attributes:\n- **`[FromRoute]`** — values from the route template (`/rooms/{id}`).\n- **`[FromQuery]`** — the query string (`?category=double`).\n- **`[FromBody]`** — the request body, typically JSON (only one per action, deserialized).\n- **`[FromForm]`** — form fields and file uploads.\n- **`[FromHeader]`** — a header value.\n- **`[FromServices]`** — inject a DI service instead of request data.\n\n```csharp\n[HttpGet(\"rooms/{id}\")]\npublic IActionResult Get(int id, [FromQuery] string category) { ... }\n\n[HttpPost(\"reservations\")]\npublic IActionResult Create([FromBody] BookingDto dto) { ... }\n```\n\nWith **`[ApiController]`** the defaults are smart — complex types bind from the body, simple types from route/query — so you often omit the attributes. Binding also handles collections and nested objects. If a value can't convert (`\"abc\"` for an `int`), the parameter stays default and a **model-state error** is recorded for validation to catch." },

    { id:"asp-validation", cat:"aspnet",
      prompt:"Model validation in ASP.NET Core — data annotations, ModelState, and [ApiController]?",
      a:"After binding, ASP.NET Core validates the model against its rules and records the outcome in **`ModelState`**.\n\nRules via **data annotations** on the model:\n```csharp\npublic class BookingDto {\n    [Required] public int RoomId { get; set; }\n    [Required, EmailAddress] public string Email { get; set; }\n    [Range(1, 30)] public int Nights { get; set; }\n    [StringLength(100)] public string Name { get; set; }\n}\n```\nCommon ones: `[Required]`, `[Range]`, `[StringLength]`/`[MaxLength]`, `[EmailAddress]`, `[RegularExpression]`, `[Compare]`.\n\nChecking it:\n- In an MVC controller you check `if (!ModelState.IsValid) return BadRequest(ModelState);`.\n- With **`[ApiController]`** on a Web API controller it's **automatic** — an invalid model returns a **400** with a problem-details body *before your action runs*, so you rarely write the check yourself.\n\nFor rules too complex for annotations: implement **`IValidatableObject`** for cross-field checks (e.g. checkOut must be after checkIn), write a custom `ValidationAttribute`, or use **FluentValidation** (a popular library for expressive, testable rules). Validate at the boundary so bad data never reaches your services." },

    { id:"asp-filters", cat:"aspnet",
      prompt:"Filters in ASP.NET Core — the filter pipeline, and how do they differ from middleware?",
