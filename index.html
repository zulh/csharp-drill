    data: [
"EF Core is the ORM — it maps my C# objects to database tables, so I can write LINQ instead of raw SQL. Each DbSet maps to a table, and the LINQ I write against it gets translated into SQL.",
"The DbContext is really the heart of EF Core — it's a unit of work, a change tracker, and my gateway to the database all at once. I load an entity, change a property, call SaveChanges, and it works out the update and runs it inside a transaction. It's registered scoped, one per request, because it's lightweight and not thread-safe — so you never want to share a single instance across concurrent requests.",
"Migrations let me version the schema straight from the C# model — I add a property, run migrations-add and then database-update, and EF generates the alter-table for me. The real win is that the schema change now lives in source control and flows through the same pipeline as the code, so I'm never hand-editing a production database.",
"The classic performance trap is the N-plus-one problem — you load a list, then lazily touch each row's related data, and a hundred rows quietly becomes a hundred and one queries. I fix it by eager-loading with Include so it's a single joined query, or by projecting just the fields I need. And for read-only queries I use AsNoTracking to skip the change-tracking overhead.",
"I keep DTOs separate from my entities for two reasons — so I don't leak the database shape straight out to clients, and so a client can't over-post fields it shouldn't be touching. My response DTO only exposes what the API actually needs, and my create DTO doesn't even include an id, so nobody can slip a primary key in.",
"When LINQ isn't the right tool — say a heavy reporting query, or an existing stored procedure — I'll drop to raw SQL, but I always pass the values as parameters. That way, even something malicious is treated as a literal value rather than as SQL to execute."
    ],
    sql: [
"A transaction groups several statements into one atomic unit, and ACID describes its four guarantees. Atomicity — all or nothing. Consistency — you never leave constraints violated. Isolation — concurrent transactions don't corrupt each other. And durability — once it's committed, it survives a crash. I reach for a transaction on any multi-step write that has to stay consistent, like a payment or a policy issuance.",
"The isolation level controls how much concurrent transactions can interfere with each other, and it's a trade-off against concurrency. Read committed is the usual default, and it stops dirty reads. As you move up through repeatable read to serializable, you remove more anomalies — the three to know are dirty reads, non-repeatable reads, and phantom reads.",
"An index is a sorted structure, usually a B-tree, that lets the database find rows without scanning the whole table. You get one clustered index per table, which defines the physical order, and as many non-clustered indexes as you like. The trade-off is that reads get faster but writes get slower, because every index has to be maintained — so I index the columns I actually filter, join, and sort on, not everything.",
"An inner join gives me only the rows that match in both tables, while a left join keeps everything on the left and fills in nulls where there's no match. A classic question is to find customers with no orders — that's a left join with a where-is-null. On keys: a primary key is the unique identity, a foreign key enforces referential integrity, and a unique constraint prevents duplicates — I actually use a unique constraint as a last line of defence for idempotency.",
"Normalization is organising your tables so that each fact lives in exactly one place, which prevents update anomalies. Denormalization is the deliberate opposite — you duplicate some data to make reads faster, which you often see in reporting. So I normalize for integrity and denormalize for read performance, depending on the workload.",
"A deadlock is when two transactions each hold a lock the other needs, and the database has to kill one of them. I avoid it by accessing rows in a consistent order, keeping transactions short, and retrying the one that gets killed. For concurrent updates I usually prefer optimistic locking — a version column that's checked on update — over pessimistic locking, because in most web apps conflicts are actually rare.",
"When a query's slow, the first thing I do is read the execution plan rather than guess. Then I make sure there are indexes on the columns in the where, join, and order-by, I select only the columns I need, and I avoid wrapping an indexed column in a function, because that stops it using the index. I also watch for the ORM firing off N-plus-one queries. Caching or denormalising only comes after the query itself is as tight as it can be."
    ],
    k8s: [
"The mental model for Kubernetes is that you declare the desired state, and a control loop constantly works to make reality match it. A pod is the smallest unit — one or more containers sharing a network identity. A deployment says 'I want three of these running' and replaces any that die. And a service is a stable address that load-balances across the healthy pods, because the pods themselves are disposable and come and go.",
"There are three health checks. Readiness asks 'can it take traffic right now' — if it fails, the pod is pulled out of the service but not restarted. Liveness asks 'is it still healthy' — if that fails, the container is restarted. And startup holds the other two off while a slow app is still booting. My quick tell is that READY zero-of-one points at readiness, whereas a climbing restart count points at liveness.",
"For almost any pod problem I run the same three commands. get pods to see the status, describe pod to read the events — that's where Kubernetes tells you about scheduling, image pulls, and probes — and logs, with dash-previous if it crashed. The rule of thumb is that if the container never started, it's in describe; if it started and then failed, it's in the logs.",
"Each failure state has a signature. CrashLoopBackOff means it starts and dies repeatedly, usually a bad config, so I check logs dash-previous. ImagePullBackOff means it can't pull the image — a wrong tag or an auth problem. Pending means it can't be scheduled, usually not enough CPU or memory on any node. And OOMKilled means it hit its memory limit — over the memory limit you get killed, but over the CPU limit you just get throttled.",
"Requests are the guaranteed minimum the scheduler uses to place a pod, so it only lands on a node with at least that much free. Limits are the hard ceiling — if you go over the memory limit you're OOMKilled, and if you go over the CPU limit you're throttled rather than killed.",
"If a deploy goes bad, I use helm history to find the last good revision and helm rollback to restore it — though in production I'd rather re-run the deploy for the previous good tag so the revert is tracked in git. Our pipeline runs in three stages: build and scan, then dockerize with the image tagged by commit SHA, then deploy with a helm upgrade. Production is gated behind a version tag rather than a branch push, so a production deploy is always deliberate."
    ],
    azure: [
"For compute I pick based on how much control I need. App Service is my default for a standard web API — I just deploy the code and it handles the rest. Functions for event-driven work that can scale to zero. Container Apps when I want to run containers without managing a whole cluster. And AKS when I genuinely need full Kubernetes.",
"For data, Azure SQL is managed SQL Server, so my EF Core code doesn't change at all. Cosmos DB is the globally distributed NoSQL option, with tunable consistency. Blob storage for files, with hot, cool, and archive tiers. And Redis for caching sessions and hot data.",
"For messaging I match the service to the pattern. Service Bus is the enterprise broker with queues and topics — it's the Azure equivalent of RabbitMQ, for reliable work. Event Hubs is high-throughput streaming that's replayable — that's the Azure Kafka. And Event Grid is lightweight event routing for reactive notifications.",
"My rule is that secrets never go in appsettings or in source control. I keep them in Key Vault, and I give the app a Managed Identity so it can authenticate to Key Vault and to SQL with no stored credentials at all — nothing to leak or rotate. That's really the modern default over connection strings.",
"For operations, Application Insights gives me request, dependency, and exception telemetry with distributed tracing, so I can trace a slow request end to end instead of guessing. For scaling I think in terms of scaling out rather than up — more instances behind a load balancer, which is why the apps should be stateless. And I define the infrastructure as code with Bicep, and use deployment slots for zero-downtime releases.",
"I'll be honest with you — my heaviest Azure work was a few years back, and I'm certified AZ-204 and AZ-900. But the core concepts — App Service, Functions, Key Vault, the messaging options, Managed Identity — are all still current and durable. What I'd need is a short refresh on the portal and SDK specifics, not a relearn of the architecture."
    ],
    design: [
"RabbitMQ and Kafka both decouple services, but on different models. RabbitMQ is a traditional queue — a message is delivered, acknowledged, and then it's gone, which is great for work queues like 'process this payment'. Kafka is an append-only log — messages are retained and replayable, and each consumer tracks its own position, which is great for high-throughput event streams. My rule of thumb is that 'do this task' goes to RabbitMQ, and 'this happened and others may care' goes to Kafka.",
"Most brokers guarantee at-least-once delivery, which means a consumer will sometimes receive the same message twice — from a retry or a redeploy. So the consumer has to be idempotent: processing a message twice has to have the same effect as processing it once. The way I do that is with a stable unique key, a check against a dedup record, and the check-and-write done atomically in a transaction. That's exactly the fix I shipped for our duplicate-issuance problem.",
"I cache data that's read often, expensive to compute, and doesn't change much — usually in Redis. The hard part is always invalidation. The pattern I use is cache-aside: I check the cache first, and on a miss I load from the database and populate the cache with a time-to-live.",
"For resilience I rely on a few patterns together: rate limiting to protect a service from overload, retries with backoff and jitter, a circuit breaker so I stop hammering a dependency that's already failing, timeouts, and idempotency so those retries are actually safe. In .NET I'd usually reach for Polly for that.",
"A monolith is simpler to build, deploy, and debug, and it scales as one unit. Microservices give you independent deployment and team autonomy, but you pay for it with real distributed-systems complexity — the network, consistency, observability. So I wouldn't reach for microservices until the complexity actually justifies it.",
"If I were designing a payment and issuance flow, the callback from the gateway arrives at least once, so I'd verify the callback signature, then put an idempotency guard at the entry point that atomically claims the payment, issue exactly once, then reconcile the status and have retry and recovery for any failures. The whole thing has to hold up under duplicate callbacks and the race between the webhook and the redirect — which is exactly the problem I solved at Senang."
    ],
    exp: [
null,
"Sure. One that really stands out was a duplicate policy-issuance bug. On our platform, once a customer paid, we'd issue their policy automatically — but issuance could be triggered from two places: the payment gateway's callback, and the redirect that brings the customer back to our app. Under certain timing, both fired, and a handful of customers ended up with the same policy issued twice. When I dug in, the root cause was a read-then-write race — both flows would check 'has this been issued yet', see no, and issue, with nothing atomic in between. I fixed it with an idempotency guard at the entry point: an atomic status transition, so the first flow to claim the issuance wins and the second simply becomes a no-op. That eliminated the duplicates completely, and the lesson I've carried since is that for anything money-related, you make the critical step idempotent and atomic — you never rely on a read-then-write check.",
"At Senang I led a cross-functional team of nine — developers, business analysts, QA, and DevOps — and I mentored three junior developers directly. The way I lead is by example first, especially around production safety and code quality, and then handing people real ownership. With the juniors, I spent a lot of time coaching them on writing safe, idempotent code and reviewing for edge cases before anything reached production, so they grew into owning their own areas.",
"Honestly, it's the stack I have the most depth in and the one I enjoy most for backend work. My heaviest hands-on .NET was 2018 to 2023, and the last couple of years I've been in Angular and Node — but the fundamentals never left me. I use OOP, SOLID, async, and dependency injection every single day in TypeScript, so coming back is a refresh, not a relearn. And it's a deliberate choice — strongly-typed, transactional backend work is what I do best, and where I want to go deep again.",
null
    ]
  };

  /* ════════════════════════════════════════════════════════
     STATE + PERSISTENCE
     ════════════════════════════════════════════════════════ */
  var KEY = "csharp-drill-v2";
  var MAX_BOX = 4;                // mastered at box 4
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { cards: {}, streak: 0, mode: "recall", cat: "all", theme: null };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function prog(id) {
    if (!state.cards[id]) state.cards[id] = { box: 0, right: 0, wrong: 0, seen: 0 };
    return state.cards[id];
  }

  /* ════════════════════════════════════════════════════════
     ELEMENTS
     ════════════════════════════════════════════════════════ */
  var el = {
    card: document.getElementById("card"),
    cat: document.getElementById("cat"),
    theme: document.getElementById("theme"),
    modeNotes: document.getElementById("mode-notes"),
    modeRecall: document.getElementById("mode-recall"),
    modeQuiz: document.getElementById("mode-quiz"),
    statsProgress: document.getElementById("stats-progress"),
    statsNotes: document.getElementById("stats-notes"),
    mastered: document.getElementById("s-mastered"),
    total: document.getElementById("s-total"),
    pos: document.getElementById("s-pos"),
    deck: document.getElementById("s-deck"),
    bar: document.getElementById("bar"),
    streak: document.getElementById("s-streak"),
    fkeys: document.getElementById("fkeys"),
    reset: document.getElementById("reset")
  };

  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4 12H2m20 0h-2M5.6 5.6 4.2 4.2m15.6 15.6-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  var MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v10m0 0a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3Zm-6-2a6 6 0 0 0 12 0M12 18v3"/></svg>';

  /* ════════════════════════════════════════════════════════
     DECK BUILDING (Leitner: weak boxes surface first)
     ════════════════════════════════════════════════════════ */
  var deck = [], idx = 0, revealed = false, answered = false;
  var notesDeck = [], noteIdx = 0, noteFlipped = false;

  function activeBank() { return state.mode === "quiz" ? QUIZ : RECALL; }

  function buildDeck() {
    if (state.mode === "notes") return buildNotes();
    var bank = activeBank().filter(function (q) {
      return state.cat === "all" || q.cat === state.cat;
    });
    // order: lowest box first (weakest / newest), then least seen, then shuffle within
    bank.sort(function (a, b) {
      var pa = prog(a.id), pb = prog(b.id);
      if (pa.box !== pb.box) return pa.box - pb.box;
      if (pa.seen !== pb.seen) return pa.seen - pb.seen;
      return Math.random() - 0.5;
    });
    deck = bank;
    idx = 0;
  }

  // Split each category's notes into ## sections — one section per note card.
  function buildNotes() {
    var cats = state.cat === "all" ? Object.keys(CATS) : [state.cat];
    var items = [];
    cats.forEach(function (c) {
      if (!NOTES[c]) return;
      NOTES[c].split(/\n(?=## )/).forEach(function (sec, i) {
        sec = sec.trim();
        if (sec) items.push({ cat: c, body: sec, say: (SAY[c] && SAY[c][i]) || null });
      });
    });
    notesDeck = items;
    noteIdx = 0;
    noteFlipped = false;
  }

  /* ════════════════════════════════════════════════════════
     MINI MARKDOWN  (bold, inline code, code fences, paragraphs)
     ════════════════════════════════════════════════════════ */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s;
  }
  function md(text) {
    var parts = text.split("```");
    var out = "";
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        out += "<pre><code>" + esc(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + "</code></pre>";
      } else {
        var blocks = parts[i].split(/\n\n+/);
        for (var b = 0; b < blocks.length; b++) {
          var block = blocks[b].replace(/^\n+|\n+$/g, "");
          if (!block) continue;
          var hm = block.match(/^(#{1,4})\s+(.+)$/);
          if (hm && block.indexOf("\n") === -1) {
            var lvl = hm[1].length;
            var tag = lvl <= 2 ? "h4" : "h5";
            out += "<" + tag + ' class="note-h note-h' + lvl + '">' + inline(hm[2]) + "</" + tag + ">";
            continue;
          }
          var first = block.split("\n")[0].replace(/^\s+/, "");
          if (/^[-•]\s/.test(first)) out += renderList(block);
          else out += "<p>" + inline(block.trim()).replace(/\n/g, "<br>") + "</p>";
        }
      }
    }
    return out;
  }

  // Point-form notes: top-level "- item", nested "  - sub-item".
  function renderList(block) {
    var lines = block.split("\n"), html = '<ul class="notes">', sub = false;
    for (var i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      var m2 = lines[i].match(/^\s{2,}[-•]\s+(.*)$/);
      var m1 = lines[i].match(/^[-•]\s+(.*)$/);
      if (m2) {
        if (!sub) { html += '<ul class="sub">'; sub = true; }
        html += "<li>" + inline(m2[1]) + "</li>";
      } else if (m1) {
        if (sub) { html += "</ul>"; sub = false; }
        html += "<li>" + inline(m1[1]) + "</li>";
      }
    }
    if (sub) html += "</ul>";
    return html + "</ul>";
  }

  /* ════════════════════════════════════════════════════════
     RENDER
     ════════════════════════════════════════════════════════ */
  function masteryPips(box) {
    var h = '<span class="mastery" title="Mastery level ' + box + ' of ' + MAX_BOX + '">';
    for (var i = 1; i <= MAX_BOX; i++) h += '<span class="pip ' + (i <= box ? "on" : "") + '"></span>';
    h += box >= MAX_BOX ? '<small>mastered</small>' : '';
    h += "</span>";
    return h;
  }

  function render() {
    revealed = false; answered = false;

    if (state.mode === "notes") return renderNotes();

    if (!deck.length) {
      el.card.innerHTML =
        '<div class="card-top"><span class="chip">empty</span></div>' +
        '<p class="prompt">No cards in this filter.</p>' +
        '<p class="say">Pick another category above, or reset progress.</p>';
      updateStats();
      return;
    }
    if (idx >= deck.length) { buildDeck(); }   // loop the pass, re-sorted by new boxes

    var q = deck[idx];
    var p = prog(q.id);

    if (state.mode === "quiz") renderQuiz(q, p);
    else renderRecall(q, p);
    updateStats();
  }

  function renderNotes() {
    if (!notesDeck.length) {
      el.card.innerHTML = '<div class="card-top"><span class="chip">empty</span></div>' +
        '<p class="prompt">Notes for this section are coming soon.</p>';
      el.statsNotes.textContent = "";
      return;
    }
    if (noteIdx < 0) noteIdx = 0;
    if (noteIdx > notesDeck.length - 1) noteIdx = notesDeck.length - 1;

    var it = notesDeck[noteIdx];
    var last = noteIdx === notesDeck.length - 1;
    var showSay = noteFlipped && it.say;

    var top =
      '<div class="card-top">' +
        '<span class="chip">' + CATS[it.cat] + '</span>' +
        '<span class="note-count">' + (noteIdx + 1) + ' / ' + notesDeck.length + '</span>' +
      '</div>';

    var face = showSay
      ? '<div class="prose spoken-face flip-face">' +
          '<div class="say-lbl">' + MIC + 'How you\'d say it</div>' +
          '<p class="spoken-text">' + inline(it.say) + '</p>' +
        '</div>'
      : '<div class="prose notes-doc flip-face">' + md(it.body) + '</div>';

    var flipBtn = it.say
      ? '<button class="btn primary flip-btn" id="note-flip">' +
          (showSay
            ? '&larr;&nbsp; Back to notes'
            : MIC + 'Say it out loud &nbsp;<span class="hint">space</span>') +
        '</button>'
      : '';

    var nav =
      '<div class="note-nav">' +
        '<button class="btn nav-prev" id="note-prev"' + (noteIdx === 0 ? ' disabled' : '') + '>&larr; Prev</button>' +
        '<button class="btn" id="note-next">' + (last ? 'Start Recall &rarr;' : 'Next &rarr;') + '</button>' +
      '</div>';

    el.card.innerHTML = top + face + '<div class="grow"></div>' +
      '<div class="controls">' + flipBtn + nav + '</div>';

    document.getElementById("note-prev").onclick = notePrev;
    document.getElementById("note-next").onclick = advanceNotes;
    var flip = document.getElementById("note-flip");
    if (flip) flip.onclick = toggleFlip;

    el.statsNotes.textContent = (state.cat === "all" ? "All sections" : CATS[state.cat]) +
      " — flip to rehearse aloud";
    window.scrollTo({ top: 0, behavior: prefersMotion() ? "smooth" : "auto" });
  }

  function toggleFlip() {
    if (notesDeck[noteIdx] && notesDeck[noteIdx].say) { noteFlipped = !noteFlipped; renderNotes(); }
  }
  function advanceNotes() {
    noteFlipped = false;
    if (noteIdx >= notesDeck.length - 1) setMode("recall");   // finished reading → go test
    else { noteIdx++; renderNotes(); }
  }
  function notePrev() { noteFlipped = false; if (noteIdx > 0) { noteIdx--; renderNotes(); } }

  function renderRecall(q, p) {
    el.card.innerHTML =
      '<div class="card-top">' +
        '<span class="chip">' + CATS[q.cat] + '</span>' +
        masteryPips(p.box) +
      '</div>' +
      '<p class="prompt">' + inline(q.prompt) + '</p>' +
      '<p class="say">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v10m0 0a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3Zm-6 -2a6 6 0 0 0 12 0M12 18v3"/></svg>' +
        'Answer it out loud, as if to the interviewer — then reveal to check.' +
      '</p>' +
      '<div class="grow"></div>' +
      '<div class="controls" id="ctrl">' +
        '<button class="btn primary" id="reveal">Reveal answer &nbsp;<span style="opacity:.7;font-family:var(--mono);font-size:12px">space</span></button>' +
      '</div>' +
      skipNavHtml();
    document.getElementById("reveal").onclick = reveal;
    wireSkip();

    function reveal() {
      revealed = true;
      var grow = el.card.querySelector(".grow");
      grow.insertAdjacentHTML("beforebegin",
        '<div class="answer"><div class="lbl">Model answer</div><div class="prose">' + md(q.a) + '</div></div>');
      document.getElementById("ctrl").innerHTML =
        '<div class="grade">' +
          '<button class="got" data-g="got">Got it<span class="k">1</span></button>' +
          '<button class="shk" data-g="shk">Shaky<span class="k">2</span></button>' +
          '<button class="mis" data-g="mis">Missed<span class="k">3</span></button>' +
        '</div>';
      Array.prototype.forEach.call(el.card.querySelectorAll(".grade button"), function (b) {
        b.onclick = function () { grade(q, b.getAttribute("data-g")); };
      });
      el.card.querySelector(".answer").scrollIntoView({ block: "nearest", behavior: prefersMotion() ? "smooth" : "auto" });
    }
    el.reveal = reveal;
  }

  function grade(q, g) {
    var p = prog(q.id);
    p.seen++;
    if (g === "got") { p.right++; p.box = Math.min(MAX_BOX, p.box + 1); state.streak++; }
    else if (g === "shk") { /* hold box */ state.streak = 0; }
    else { p.wrong++; p.box = 0; state.streak = 0; }   // missed → back to start
    save();
    next();
  }

  function renderQuiz(q, p) {
    var order = q.choices.map(function (c, i) { return i; });
    // stable-ish shuffle
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    var html =
      '<div class="card-top">' +
        '<span class="chip">' + CATS[q.cat] + '</span>' +
        masteryPips(p.box) +
      '</div>' +
      '<p class="prompt">' + inline(q.prompt) + '</p>' +
      '<div class="say" style="margin-bottom:20px">Pick one, or press keys <kbd style="font-family:var(--mono)">1</kbd>&ndash;<kbd style="font-family:var(--mono)">' + order.length + '</kbd></div>';
    html += '<div class="choices" id="choices">';
    order.forEach(function (ci, pos) {
      html += '<button class="choice" data-ci="' + ci + '" data-pos="' + pos + '">' +
              '<span class="key">' + (pos + 1) + '</span><span>' + inline(q.choices[ci][0]) + '</span></button>';
    });
    html += '</div><div class="grow"></div><div class="controls" id="ctrl"></div>' + skipNavHtml();
    el.card.innerHTML = html;

    quizOrder = order;
    Array.prototype.forEach.call(el.card.querySelectorAll(".choice"), function (b) {
      b.onclick = function () { pickChoice(q, parseInt(b.getAttribute("data-ci"), 10)); };
    });
    wireSkip();
  }

  var quizOrder = [];
  function pickChoice(q, ci) {
    if (answered) return;
    answered = true;
    var correct = q.choices[ci][1] === 1;
    var p = prog(q.id);
    p.seen++;
    if (correct) { p.right++; p.box = Math.min(MAX_BOX, p.box + 1); state.streak++; }
    else { p.wrong++; p.box = Math.max(0, p.box - 1); state.streak = 0; }
    save();

    Array.prototype.forEach.call(el.card.querySelectorAll(".choice"), function (b) {
      var bci = parseInt(b.getAttribute("data-ci"), 10);
      b.disabled = true;
      if (q.choices[bci][1] === 1) b.classList.add("correct");
      else if (bci === ci) b.classList.add("wrong");
    });

    document.getElementById("ctrl").innerHTML =
      '<div class="explain">' + inline(q.e) + '</div>' +
      '<button class="btn primary" id="qnext" style="margin-top:16px">Next &nbsp;<span style="opacity:.7;font-family:var(--mono);font-size:12px">space</span></button>';
    document.getElementById("qnext").onclick = next;
    updateStats();
  }

  function next() { idx++; render(); }
  function prevCard() { if (idx > 0) { idx--; render(); } }

  // Prev / Skip row so you can move through cards without answering or grading.
  function skipNavHtml() {
    return '<div class="skip-nav">' +
        '<button class="btn nav-prev" id="skip-prev"' + (idx === 0 ? ' disabled' : '') + '>&larr; Prev</button>' +
        '<span class="skip-pos">' + (idx + 1) + ' / ' + deck.length + '</span>' +
        '<button class="btn" id="skip-next">Skip &rarr;</button>' +
      '</div>';
  }
  function wireSkip() {
    var pv = document.getElementById("skip-prev");
    var nx = document.getElementById("skip-next");
    if (pv) pv.onclick = prevCard;
    if (nx) nx.onclick = next;
  }

  /* ════════════════════════════════════════════════════════
     STATS
     ════════════════════════════════════════════════════════ */
  function updateStats() {
    var bank = activeBank().filter(function (q) { return state.cat === "all" || q.cat === state.cat; });
    var mastered = bank.filter(function (q) { return prog(q.id).box >= MAX_BOX; }).length;
    el.mastered.textContent = mastered;
    el.total.textContent = bank.length;
    el.deck.textContent = deck.length;
    el.pos.textContent = deck.length ? Math.min(idx + 1, deck.length) : 0;
    el.bar.style.width = bank.length ? (mastered / bank.length * 100) + "%" : "0%";
    el.streak.textContent = state.streak;
  }

  /* ════════════════════════════════════════════════════════
     CONTROLS WIRING
     ════════════════════════════════════════════════════════ */
  function buildCatOptions() {
    var GROUPS = [
      ["Hotel Booking Case", ["finago"]],
      ["C# / .NET", ["lang", "oop", "async", "linq", "data", "aspnet", "test", "mig"]],
      ["Node / TypeScript", ["node"]],
      ["General", ["sql", "k8s", "azure", "design"]],
      ["Behavioral", ["behav", "exp"]]
    ];
    // fold any ungrouped category into an "Other" bucket so nothing is ever dropped
    var placed = {};
    GROUPS.forEach(function (g) { g[1].forEach(function (k) { placed[k] = true; }); });
    var leftover = Object.keys(CATS).filter(function (k) { return !placed[k]; });
    if (leftover.length) GROUPS.push(["Other", leftover]);

    var opts = '<option value="all">All categories</option>';
    GROUPS.forEach(function (g) {
      var inner = "";
      g[1].forEach(function (k) {
        if (CATS[k]) inner += '<option value="' + k + '">' + CATS[k] + '</option>';
      });
      if (inner) opts += '<optgroup label="' + g[0] + '">' + inner + '</optgroup>';
    });
    el.cat.innerHTML = opts;
    el.cat.value = state.cat;
  }

  var MODES = ["notes", "recall", "quiz"];
  function applyModeChrome(m) {
    el.modeNotes.setAttribute("aria-pressed", m === "notes");
    el.modeRecall.setAttribute("aria-pressed", m === "recall");
    el.modeQuiz.setAttribute("aria-pressed", m === "quiz");
    var notes = m === "notes";
    el.statsProgress.style.display = notes ? "none" : "contents";
    el.statsNotes.style.display = notes ? "" : "none";
  }
  function setMode(m) {
    state.mode = m; save();
    applyModeChrome(m);
    buildDeck(); render();
  }
  function cycleMode() { setMode(MODES[(MODES.indexOf(state.mode) + 1) % MODES.length]); }

  el.modeNotes.onclick = function () { setMode("notes"); };
  el.modeRecall.onclick = function () { setMode("recall"); };
  el.modeQuiz.onclick = function () { setMode("quiz"); };
  el.cat.onchange = function () { state.cat = el.cat.value; save(); buildDeck(); render(); };

  el.reset.onclick = function () {
    if (!confirm("Reset all mastery progress and streak? Your cards go back to unseen.")) return;
    state.cards = {}; state.streak = 0; save();
    buildDeck(); render();
  };

  /* ── Theme ─────────────────────────────────────────── */
  function currentTheme() {
    if (state.theme) return state.theme;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme() {
    var t = currentTheme();
    document.documentElement.setAttribute("data-theme", t);
    el.theme.innerHTML = t === "dark" ? SUN : MOON;
  }
  el.theme.onclick = function () {
    state.theme = currentTheme() === "dark" ? "light" : "dark";
    save(); applyTheme();
  };

  function prefersMotion() { return !matchMedia("(prefers-reduced-motion: reduce)").matches; }

  /* ── Keyboard ──────────────────────────────────────── */
  el.fkeys.innerHTML =
    '<kbd>space</kbd> reveal / flip &nbsp;·&nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> grade &nbsp;·&nbsp; <kbd>←</kbd><kbd>→</kbd> prev / next &nbsp;·&nbsp; <kbd>m</kbd> mode';

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();

    if (k === "m") { cycleMode(); e.preventDefault(); return; }

    if (state.mode === "notes") {
      if (k === " " || k === "enter") { e.preventDefault(); toggleFlip(); }
      else if (k === "arrowright") { e.preventDefault(); advanceNotes(); }
      else if (k === "arrowleft") { e.preventDefault(); notePrev(); }
      return;
    }

    // Recall + Quiz: arrows skip between cards without answering.
    if (k === "arrowright") { e.preventDefault(); next(); return; }
    if (k === "arrowleft") { e.preventDefault(); prevCard(); return; }

    if (state.mode === "recall") {
      if ((k === " " || k === "enter") && !revealed) { e.preventDefault(); if (el.reveal) el.reveal(); return; }
      if (revealed && (k === "1" || k === "2" || k === "3")) {
        e.preventDefault();
        grade(deck[idx], k === "1" ? "got" : k === "2" ? "shk" : "mis");
      }
    } else {
      if (!answered && quizOrder.length) {
        var n = parseInt(k, 10);
        if (n >= 1 && n <= quizOrder.length) {
          e.preventDefault();
          var q = deck[idx];
          pickChoice(q, quizOrder[n - 1]);
          return;
        }
      }
      if (answered && (k === " " || k === "enter")) { e.preventDefault(); next(); }
    }
  });

  /* ── Boot ──────────────────────────────────────────── */
  buildCatOptions();
  applyModeChrome(state.mode);
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if (!state.theme) applyTheme(); });
  buildDeck();
  render();
})();
</script>
</body>
</html>
