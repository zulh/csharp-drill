      a:"Filters run **inside** the MVC action pipeline, wrapped around controller actions — so unlike middleware they have access to MVC context (the action, model state, the result). Use them for cross-cutting concerns scoped to actions.\n\nThe types, in execution order:\n- **Authorization filters** — run first; enforce access (`[Authorize]`).\n- **Resource filters** — run early and late around the rest; good for caching or short-circuiting.\n- **Action filters** — run **before and after** the action; inspect or modify the arguments and the result (logging, validation).\n- **Exception filters** — turn an unhandled exception from the action into a response.\n- **Result filters** — run before/after the result executes (before the JSON/view is written).\n\n```csharp\npublic class LogFilter : IActionFilter {\n    public void OnActionExecuting(ActionExecutingContext c) { }  // before\n    public void OnActionExecuted(ActionExecutedContext c) { }    // after\n}\n```\nApply them globally, per-controller, or per-action; use `[ServiceFilter]` / `[TypeFilter]` when the filter needs DI.\n\n**Filter vs middleware:** middleware is app-wide and sees only the raw `HttpContext`; filters are MVC-aware (they see the action and model state) and can target specific controllers/actions. Rule of thumb: **middleware for truly global concerns** (HTTPS, auth, logging every request); **filters for MVC-specific cross-cutting logic** (model-state checks, action logging, exception-to-response mapping)." },

    { id:"b-codereview", cat:"behav",
      prompt:"As a team lead, how do you do code reviews, and what do you look for?",
      a:"So for me, code review isn't just about catching bugs, it's also about keeping the code consistent and mentoring the more junior developers. So I try to approach it in a helpful way, not a critical one.\n\nAs a lead, I review promptly so I'm not blocking anyone, and I ask the team to keep pull requests small and focused on one thing, because those are much easier to review properly. I also let the tooling handle the boring stuff, so formatting, linting, and tests all run in CI, which frees up the review for what actually matters.\n\nFor what I look at, I go in roughly this order. First, correctness, does it do what it should, and did they handle the edge cases and error paths, not just the happy path. Second, readability, can the next person understand it easily. Third, tests, especially on the tricky logic. Fourth, security, so input validation, no secrets committed, no SQL injection, and the right authorization checks, which matters a lot in payments. Fifth, performance, but only the obvious things like an N+1 query. And finally, does it follow our existing patterns and architecture.\n\nOne thing I'm careful about is separating the must-fix comments from the small nice-to-haves, and especially with the juniors, I explain the why behind a comment, because the point is for them to learn. And if there's a lot of back and forth, I'll just hop on a quick call, which is faster and friendlier than twenty written comments." },

    { id:"k8s-cicd-create", cat:"k8s",
      prompt:"How do you set up a CI/CD pipeline?",
      a:"The goal: every code change is automatically built, tested, and deployed, so releases are safe and repeatable. I define the pipeline **as code** (YAML in the repo) using something like **GitHub Actions**, **Azure DevOps Pipelines**, or GitLab CI.\n\n**CI (Continuous Integration) — runs on every push / PR:**\n1. **Trigger** — a push or pull request to a branch kicks it off.\n2. **Build** — restore dependencies and compile (`dotnet restore` / `dotnet build`).\n3. **Test** — run the unit tests (`dotnet test`); the pipeline **fails** if any fail. Often add linting, code coverage, and static analysis (e.g. SonarQube).\n4. **Package** — publish the app and build a **Docker image**, then push it to a registry (Azure Container Registry, Docker Hub).\n\n**CD (Continuous Delivery / Deployment) — promotes the artifact:**\n5. **Deploy** through environments **dev → staging → prod**, with an **approval gate** before prod. Deploy to Kubernetes (`kubectl` / **Helm**) or Azure App Service, pulling config and secrets from **Key Vault**, not from the pipeline.\n6. **Verify** — health checks / smoke tests after deploy, and **roll back** automatically if they fail.\n\n**Key practices I follow:**\n- **Build once, promote the same artifact** through every environment — never rebuild per environment.\n- **Branch protection** — require green CI before a merge.\n- Keep CI **fast** so feedback is quick; secrets live in a **secret store**, never in the YAML.\n- Safer prod rollouts with **blue-green or canary** deployments.\n\nThis is the design behind the git-push flow: push → CI builds and tests → image pushed to the registry → CD deploys it to the cluster." },

    { id:"mig-why", cat:"mig",
      prompt:"Why migrate a legacy app from .NET Framework to .NET 8?",
      a:".NET Framework is **Windows-only and in maintenance mode**, no new features, just security fixes. .NET 8 is the modern, unified platform, and moving to it buys you:\n\n- **Performance** — .NET 8 is dramatically faster than .NET Framework (throughput, memory, startup), which directly cuts hosting cost.\n- **Cross-platform** — it runs on Linux and in **containers**, so you can host cheaper and cloud-native instead of Windows-only IIS.\n- **LTS support** — .NET 8 is a Long-Term Support release (3 years), so it's a safe target to standardise on.\n- **One unified platform** — since .NET 5 there's a single .NET (no more Framework vs Core split); .NET 8 is the current LTS on that line.\n- **Modern C# and ecosystem** — the latest language features, minimal hosting in `Program.cs`, built-in DI, and a library ecosystem that targets .NET, not Framework.\n\nThe one-liner: *Framework is legacy and Windows-locked; .NET 8 is faster, cross-platform, cloud-ready, and actively supported.*" },

    { id:"mig-netversions", cat:"mig",
      prompt:".NET Framework vs .NET Core vs .NET 5/8 — what is the landscape?",
      a:"- **.NET Framework (up to 4.8)** — the original, **Windows-only**, tightly coupled to IIS and `System.Web`. Still supported but **maintenance-only**, no new features.\n- **.NET Core (1.0 to 3.1)** — the rewrite: cross-platform, open-source, modular, high-performance. This is where the modern model (middleware, built-in DI, `appsettings.json`) came from.\n- **.NET 5+** — Microsoft **dropped 'Core' and 'Framework' from the name** and unified everything into just **.NET**. So 5, 6, 7, 8 are the continuation of Core, one platform going forward.\n- **.NET Standard** — a **specification** (a set of APIs) that Framework, Core, and Xamarin all implement, so a `netstandard2.0` library works across all of them. It's the bridge you target for shared libraries during a migration.\n\nMental model: Framework is the old Windows line, Core became the new cross-platform line, and from .NET 5 they merged into one .NET, of which **.NET 8 is the current LTS**. .NET Standard is the compatibility layer between the two worlds." },

    { id:"mig-approach", cat:"mig",
      prompt:"How would you approach migrating a large legacy .NET Framework app to .NET 8?",
      a:"I'd go **incremental, not big-bang** — a full rewrite of a large app is high-risk and delays value. The pattern is the **Strangler Fig**:\n\n- Stand the new .NET 8 app up **alongside** the old one, and put a **proxy** in front (often **YARP**) that routes each request to either the old or the new system.\n- Migrate **one module or route at a time**, shifting traffic over as each piece is proven, until the old app is fully \"strangled\" and can be retired.\n- Keep it **shippable throughout** — the app keeps running the whole time, so you deliver value continuously and de-risk.\n\nTooling to accelerate it:\n- **.NET Upgrade Assistant** — Microsoft's guided CLI/Visual Studio tool that does much of the mechanical retargeting.\n- **try-convert** — converts old project files to the SDK style.\n\nA big-bang only makes sense for **small** apps where the rewrite is quick and low-risk. For anything enterprise-scale, incremental wins. This maps directly to planning the roadmap and managing delivery risk, which is the Senior Consultant remit." },

    { id:"mig-blockers", cat:"mig",
      prompt:"What are the common blockers when moving from .NET Framework to .NET 8?",
      a:"The mechanical retargeting is easy; the blockers are the Framework-only pieces with no direct equivalent:\n\n- **`System.Web` doesn't exist** in modern .NET, so anything built on it needs reworking.\n- **WebForms** has **no migration path** — it must be **rewritten** (to ASP.NET Core MVC/Razor or Blazor).\n- **WCF server** isn't supported — move to **CoreWCF**, or better, **gRPC / REST**. (ASMX is gone too.)\n- **`Global.asax`** → `Program.cs` startup; **`web.config`** → `appsettings.json` plus the Options pattern.\n- **HttpModules & HttpHandlers** → **middleware**.\n- **`packages.config`** → **`PackageReference`**, and old-style `.csproj` → **SDK-style** project files.\n- **Auth** — `System.Web.Security` / Membership → ASP.NET Core Identity or JWT.\n- **Third-party & NuGet packages** — some have no .NET-compatible version, so you find replacements or isolate them.\n- **Not supported at all** — AppDomains, .NET Remoting, Code Access Security.\n\nThe assessment step is about finding these early so they don't blow up the timeline." },

    { id:"mig-strategy", cat:"mig",
      prompt:"What is your strategy and tooling for a .NET 8 migration — where do you start?",
      a:"**1. Assess first.** Run the **.NET Portability Analyzer** (and the API/upgrade analyzers) across the solution to see how much code uses APIs that don't exist in .NET 8. That report drives the roadmap and surfaces the blockers up front.\n\n**2. Migrate bottom-up.** Start with the **leaf projects** — shared class libraries with the fewest dependencies — and work up toward the app. Retarget shared libraries to **.NET Standard 2.0** where possible, so they run on *both* Framework and .NET 8 during the transition.\n\n**3. Modernise the project files** — convert to SDK-style `.csproj` and `PackageReference`; that alone unblocks a lot.\n\n**4. Replace incompatible APIs** the analyzer flagged (config, DI, logging, HTTP).\n\n**5. Protect behaviour with tests.** Write **characterization tests** that lock in the current behaviour *before* you change anything, so you can prove the migrated code behaves identically. Run old and new side by side and compare.\n\n**6. Ship incrementally** and validate at each step, rather than a big-bang cutover.\n\nThe principle: *assess, migrate the foundations first, and keep it building and tested at every step.*" },

    { id:"mig-risk", cat:"mig",
      prompt:"As the technical lead, how do you manage risk and delivery on a modernization project?",
      a:"This is the heart of the Senior Consultant role, keeping a risky upgrade on track:\n\n- **Assess before committing dates.** The Portability Analyzer and a dependency audit surface the real blockers (WebForms, WCF, dead packages) early, so the timeline is grounded in reality, not optimism.\n- **Sequence the roadmap by risk and dependency.** Foundations and the highest-risk unknowns first; leaf libraries before the app; a thin end-to-end slice early to prove the approach.\n- **Deliver incrementally** (Strangler Fig) so there's always a working system and value lands continuously, instead of a big-bang cutover at the end.\n- **Guard quality** with characterization tests, code review, and CI, so \"modernised\" never means \"regressed\".\n- **Track and escalate** — keep a live risk/issue log and flag bottlenecks to the delivery manager **early**, rather than when they're on fire.\n- **Coordinate the team** — a clear task breakdown for the analysts and developers, and proper onboarding so new resources ramp fast.\n\nThe theme is the same one I apply to production safety: surface the risk early, deliver in safe increments, and never trade quality for speed." },

    { id:"b-hire-mig", cat:"behav",
      prompt:"Why should we hire you for this .NET modernization role?",
      a:"So a few reasons. First, I'm a hands-on .NET developer with around nine years of experience, and most of my career has been in the strongly-typed, backend, transactional space, which is exactly this kind of work. Second, I lead technically, I run a team of nine and mentor three juniors, so I'm comfortable with the coordination, the code review, and the technical guidance this role needs, not just writing code myself. Third, I see modernization as a risk-management problem at its core, so assessing the blockers early, migrating incrementally rather than big-bang, and protecting behaviour with tests, and that's the same discipline I already apply to production-critical payment systems. And I've worked in delivery-focused, client-facing environments before, so the consulting side isn't new to me. So I bring the hands-on depth, the technical leadership, and the delivery mindset together, which is really what this role is asking for." },

    { id:"b-whyrole-mig", cat:"behav",
      prompt:"Why this role, and why Deloitte? (modernization / consulting)",
      a:"So a few things draw me to this. First, the work itself, it's hands-on .NET combined with technical leadership on modernization projects, and that's exactly the intersection I want to be in, staying close to the code while guiding a team. Second, it's a deliberate return to backend .NET for me, which is where I do my best and most enjoyable work. And third, on Deloitte specifically, it's a consulting environment working across enterprise clients, so I'd get exposure to a real range of systems and hard architectural problems, and the modernization focus means solving genuinely interesting upgrade challenges, not just maintenance. So the role lines up with both what I'm strongest at and the direction I want to grow in." },

    { id:"r-valref", cat:"lang",
      prompt:"Value types vs reference types — what's the real difference, and why does it matter?",
      a:"A **value type** (struct, int, bool, enum, `DateTime`) holds its data directly. Assign it or pass it to a method and you copy the whole value — the callee gets its own independent copy, so changes it makes are **not** seen by the caller.\n\nA **reference type** (class, string, array, most things) holds a reference to an object on the heap. Assign or pass it and you copy the *reference* — both variables point at the **same object**, so a change through one is seen by the other.\n\n```csharp\nvoid Bump(Point p) { p.X++; }   // struct: caller unchanged\nvoid Bump(Order o) { o.Total++; } // class: caller sees it\n```\n\nThe practical tell: \"does the caller see my change?\" Value = no, reference = yes. Watch the gotcha that `string` is a *reference* type but behaves value-like because it's immutable." },

    { id:"r-crs", cat:"lang",
      prompt:"class vs record vs struct — when do you reach for each?",
      a:"**class** — reference type, identity-based equality (two objects are equal only if they're the same instance). The default for most things: services, entities, anything with behavior.\n\n**record** — still a reference type, but the compiler gives you **value-based equality** (equal if all members match), `with`-expressions for non-destructive copies, and a nice `ToString`. Reach for it for **immutable data / DTOs** — an API response, a value object.\n\n**struct** — value type, copied on assignment, lives on the stack (no heap allocation). Use for **small, short-lived values** where copying is cheap — a coordinate, a money amount. Keep them small and ideally immutable, or copying semantics bite you.\n\nOne line: *class for behavior and identity, record for immutable data, struct for small cheap values.*" },

    { id:"r-var", cat:"lang",
      prompt:"var — what is it, and when is it a bad idea?",
      a:"`var` is **implicit typing**: the compiler infers the static type from the right-hand side. It's still strongly typed — `var x = 5;` is exactly `int x = 5;`, just less to type. No runtime cost, no dynamic behaviour.\n\nGood when the type is obvious from the RHS (`var user = new User();`) or genuinely unspeakable (LINQ anonymous types).\n\nBad when it *hides* the type and hurts readability — `var result = Process(data);` tells a reader nothing. Rule of thumb: use `var` when the type is on the line already, spell it out when it isn't." },

    { id:"r-pillars", cat:"oop",
      prompt:"The four pillars of OOP — name them and give a one-line 'why' for each.",
      a:"**Encapsulation** — bundle data with the methods that guard it, and hide the internals behind a public surface. Why: callers can't put the object in an invalid state.\n\n**Abstraction** — expose *what* something does, hide *how*. Why: you can swap the implementation without touching callers (this is what enables Dependency Inversion).\n\n**Inheritance** — a subclass reuses and extends a base. Why: share common behaviour — but favour composition; deep inheritance trees get brittle.\n\n**Polymorphism** — one interface, many implementations chosen at runtime. Why: it replaces `switch`/`if` chains with a virtual call, which is what makes code Open/Closed." },

    { id:"r-solid", cat:"oop",
      prompt:"Walk me through SOLID.",
      a:"Five principles all pointing at one goal — **change code safely**.\n\n**S — Single Responsibility.** One reason to change; better, answer to one stakeholder. If finance, the DBA and HR can each demand a change to the same class, split it.\n\n**O — Open/Closed.** Add behaviour by writing new code, not editing tested code. In practice: replace a conditional with polymorphism — a new `IPaymentProcessor` instead of another branch in a payment `switch`.\n\n**L — Liskov.** A subtype must be usable anywhere its base is, *behaviourally* — can't demand more, promise less, or throw what the base doesn't. Tell: calling code needing an `is` check.\n\n**I — Interface Segregation.** No client depends on methods it doesn't use. `NotImplementedException` in an impl means the interface is too fat. It's SRP for interfaces.\n\n**D — Dependency Inversion.** Policy and detail both depend on an abstraction owned by the policy side. `IOrderRepository` lives with the domain; `SqlOrderRepository` points up at it." },

    { id:"r-dip", cat:"oop",
      prompt:"Dependency Inversion specifically — and how is it different from Dependency Injection?",
      a:"**DIP has two halves:** high-level modules shouldn't depend on low-level ones — both depend on abstractions; and abstractions shouldn't depend on details — details depend on abstractions.\n\nThe word *inversion*: normally the arrow runs from business logic **down** to plumbing (`OrderService → SqlOrderRepository`). DIP flips it — the plumbing points **up** at an abstraction that lives with the business logic:\n\n```\nOrderService → IOrderRepository ← SqlOrderRepository\n  (domain)        (domain)          (infrastructure)\n```\n\nThe insight most people miss: **the interface is owned by the consumer, not the provider.** Infrastructure references the domain, never the reverse. Your domain doesn't know SQL exists.\n\n**DIP ≠ DI.** Dependency Injection is just a *technique* to achieve it. You can use a DI container and still violate DIP — e.g. injecting concrete classes, or making the domain reference EF Core to define the interface." },

    { id:"r-liskov", cat:"oop",
      prompt:"Explain Liskov Substitution — and give a real example of a violation.",
      a:"A subtype must be usable **anywhere** its base is, and the point is it's about **behaviour, not compiling** — the compiler already guarantees the type fits. Liskov is the promise it also *behaves* right, so the caller never has to know which subtype it got.\n\nA subtype must not: demand more than the base (stronger preconditions), promise less (weaker postconditions), throw exceptions the base doesn't, or break its invariants.\n\n**The tell:** calling code that needs `if (x is SomeSubtype)`, or a `catch` for one subtype only.\n\n**Real one from .NET itself:**\n```csharp\nIList<int> list = new[] {1,2,3};  // arrays implement IList<T>\nlist.Add(4);   // NotSupportedException at runtime\n```\nAn array is a fixed-size `IList<T>` that throws on `Add` — a shipped Liskov violation, and exactly why `IReadOnlyList<T>` was added." },

    { id:"r-di-life", cat:"oop",
      prompt:"AddScoped vs AddSingleton vs AddTransient — and why is Scoped different from Transient?",
      a:"They're the three DI **lifetimes** — how long the container keeps one instance:\n\n**Singleton** — one instance for the whole app. Good for stateless/shared things (a clock, config, a cache). Must be thread-safe.\n\n**Scoped** — one instance **per scope**, which in ASP.NET Core means **per HTTP request**. Everything in that one request shares it; the next request gets a fresh one. This is where `DbContext` lives.\n\n**Transient** — a **new instance every time** it's asked for, even twice within the same request. For cheap, stateless helpers.\n\n**Scoped vs Transient:** within a single request, Scoped hands out the *same* object to every dependency that needs it; Transient hands out a *new* one each time. That's why a Scoped `DbContext` lets several services share one unit-of-work and transaction — Transient would give each its own." },

    { id:"r-composition", cat:"oop",
      prompt:"Composition over inheritance — what does it mean and why favour it?",
      a:"**Inheritance is 'is-a'; composition is 'has-a'.**\n\n- **Inheritance** — a subclass *is a* kind of its base and inherits its behaviour (`SavingsAccount : Account`).\n- **Composition** — a class *has* other objects and delegates to them, assembling behaviour from swappable parts.\n\n**Why favour composition:**\n- With inheritance you get **everything** from the base, including what you don't want, and you're welded to it (fragile base class; change the parent, break the children).\n- Inheritance is fixed at compile time and C# allows only **one** base class; composed parts are swappable at runtime and you can combine many.\n- It avoids the **combinatorial explosion** — instead of `FlyingSwordChar`, `WalkingBowChar`… a `Character` just *has-a* `IMovement` and `IWeapon`.\n\n**The insight to say out loud:** *composition in practice is just **dependency injection** — my services are given injected interfaces rather than inheriting a base class, which is why they're easy to swap and mock.*\n\nDon't over-swing: keep inheritance for a **true is-a** with stable shared behaviour (a framework base class). *Favour* composition, don't ban inheritance." },

    { id:"r-virtual", cat:"oop",
      prompt:"virtual, override, abstract, sealed, new — what does each keyword do?",
      a:"These are the mechanism **behind polymorphism** — how the runtime picks the right implementation.\n\n- **`virtual`** — marks a base method as *overridable*. Without it a method can't be replaced. **In C# methods are non-virtual by default** (opposite of Java — a classic gotcha).\n- **`override`** — the subclass replaces the virtual method; the runtime calls the overridden version **even through a base reference**. Use `base.Method()` to reuse the parent's logic.\n- **`abstract`** — a method with **no body** that subclasses *must* implement; its class must also be `abstract` and **can't be instantiated**. (`virtual` = optional default; `abstract` = no default, must supply one.)\n- **`sealed`** — the opposite of virtual: stops further inheriting/overriding.\n- **`new` (method hiding)** — *hides* rather than overrides; dispatch then follows the **reference type**, not the runtime object. Almost always a mistake.\n\n```csharp\nBase a = new Over();  a.Go();  // override → \"Over\" (runtime type wins)\nBase b = new Hide();  b.Go();  // new/hiding → \"Base\" (reference type wins)\n```\n\nOne-liner: *base declares `virtual`/`abstract`, subclass `override`s, runtime dispatches to the real object's version — that's polymorphism under the hood.*" },

    { id:"r-async", cat:"async",
      prompt:"What does async/await actually do — and what does it NOT do?",
      a:"`await` on an I/O operation (a DB call, an HTTP request) **releases the current thread back to the thread pool** while the I/O is in flight, then resumes your method when the result is ready. The compiler rewrites the method into a state machine to make that pause/resume work.\n\nWhat it buys you: **throughput / scalability**. That thread can go serve other requests instead of blocking. A server handling 1000 concurrent requests doesn't need 1000 threads parked on the DB.\n\n**What it does NOT do:** make any single call faster. An `await`ed query that takes 200ms still takes 200ms — you haven't sped it up, you've just stopped wasting a thread while you wait. Async is about *doing more at once*, not *doing one thing quicker*.\n\nGotcha to name: never `.Result`/`.Wait()` on async code — it blocks the thread you were trying to free, and can deadlock." },

    { id:"r-taskthread", cat:"async",
      prompt:"Task vs Thread — and what does 'improves throughput, not the speed of a single call' mean?",
      a:"A **Thread** is an actual OS thread — expensive (≈1MB stack), you manage its life. A **Task** is a higher-level *promise of future work* that runs on the shared **thread pool**; the runtime schedules it. You almost always want `Task`.\n\n**\"Improves throughput, not single-call speed\":** imagine a waiter (a thread). If they stand at one table waiting for the kitchen, one table is served slowly and everyone else waits. Async is the waiter taking other tables' orders while the kitchen cooks — the first meal doesn't arrive any sooner (*same single-call speed*), but far more tables get served in the same hour (*higher throughput*).\n\nOn a server, threads are the waiters. Freeing one during I/O means the same pool serves many more concurrent requests — you scale, you don't accelerate the individual request." },

    { id:"r-ienum", cat:"linq",
      prompt:"IEnumerable vs IQueryable — what's the difference and why care?",
      a:"**`IEnumerable<T>`** represents an in-memory sequence. LINQ over it runs as **LINQ-to-Objects** — the filtering happens in your app, in C#.\n\n**`IQueryable<T>`** represents a query that hasn't run yet. LINQ over it builds an **expression tree** that a provider (EF Core) **translates to SQL** and runs in the database.\n\nWhy it matters — the classic bug:\n```csharp\ndb.Orders.Where(o => o.Total > 100)   // IQueryable → WHERE in SQL ✅\ndb.Orders.ToList().Where(o => o.Total > 100) // IEnumerable → pulls ALL rows, filters in memory ❌\n```\nCall `ToList()`/`AsEnumerable()` too early and you drag the whole table across the wire, then filter in C#. Keep it `IQueryable` until the database has done all the work it can." },

    { id:"r-deferred", cat:"linq",
      prompt:"Deferred execution in LINQ — what is it and where does it bite people?",
      a:"Most LINQ operators (`Where`, `Select`, `OrderBy`) are **lazy** — they don't run when you write them, they build a pipeline. Execution happens only when you **enumerate**: `foreach`, `ToList()`, `Count()`, `First()`.\n\nTwo bites:\n\n**Multiple enumeration** — if you hold a query in a variable and enumerate it twice, the work (and the DB round-trip) happens **twice**. Materialise once with `ToList()` if you'll reuse it.\n\n**Captured variables / closures** — the query reads the variable's value at *execution* time, not definition time. Change it in a loop before enumerating and you get surprises.\n\nOne line: LINQ describes work; enumeration performs it — know which line actually hits the database." },

    { id:"r-dbcontext", cat:"data",
      prompt:"EF Core DbContext — what is it, and why is its lifetime Scoped?",
      a:"`DbContext` is EF Core's **unit of work + identity map**. It represents a session with the database: it tracks the entities you've loaded, records the changes you make, and on `SaveChanges()` writes them all in **one transaction**. Its `DbSet<T>` properties are your queryable tables.\n\n**Change tracking:** load an entity, mutate a property, call `SaveChanges()` — EF diffs against the snapshot it kept and generates the `UPDATE`. No explicit save-per-field.\n\n**Why Scoped (per request):** it's a lightweight, **not thread-safe**, short-lived session. One per HTTP request means all the services in that request share one unit-of-work and one transaction boundary. Singleton would be a threading disaster and a memory leak (the change tracker grows forever); Transient would fragment your transaction across contexts." },

    { id:"r-pgsql", cat:"data",
      prompt:"PostgreSQL vs SQL Server — how would you compare them?",
      a:"Both are mature relational databases; day to day with EF Core the app code barely changes — you swap the provider (`UseNpgsql` vs `UseSqlServer`).\n\n**PostgreSQL** — open-source, no licensing cost, famously strong on standards compliance and rich types: first-class **`JSONB`**, arrays, powerful indexing (GIN/GiST), great extensibility. Very popular in cloud-native / container stacks.\n\n**SQL Server** — Microsoft's, deep .NET/Windows/Azure integration, excellent tooling (SSMS), strong enterprise support; licensing cost is the trade-off.\n\nHonest positioning for me: my production data work has been **MySQL and SQL Server**, and I'm comfortable on the relational fundamentals — schema design, indexing, transactions, query tuning — which transfer directly. Picking up Postgres specifics like `JSONB` is a small step, not a relearn." },

    { id:"r-nplus1", cat:"data",
      prompt:"What's the N+1 query problem and how do you fix it?",
      a:"You load N parent rows, then lazily access a navigation property in a loop — so EF fires **1 query for the parents + N queries** for each parent's children. 100 orders becomes 101 round-trips. It's the most common EF performance killer and it hides in code that looks innocent.\n\n**Fixes:**\n- **Eager load** with `.Include(o => o.Lines)` so it's one query with a join.\n- **Projection** — `.Select(o => new { o.Id, LineCount = o.Lines.Count })` to pull only what you need.\n- Watch out for lazy loading being on by default in some setups — that's what silently triggers it.\n\nHow you'd catch it: turn on EF query logging and watch for a burst of identical parameterised queries." },

    { id:"r-k8s", cat:"k8s",
      prompt:"Explain Kubernetes to me — pod, deployment, service.",
      a:"Kubernetes is a **container orchestrator** — it runs your containers across a cluster of machines and keeps them in the state you declared.\n\n**Pod** — the smallest deployable unit: one (or a few tightly-coupled) containers sharing a network address. Pods are disposable — they come and go.\n\n**Deployment** — the declarative controller: \"I want 3 replicas of this image.\" It creates the pods, replaces ones that die, and handles **rolling updates** (spin up new, drain old) and rollbacks. You edit desired state; K8s reconciles reality to it.\n\n**Service** — a stable network endpoint (a fixed name + virtual IP) in front of a changing set of pods. Because pods are ephemeral and their IPs churn, the Service gives clients one address and **load-balances** across the healthy pods behind it.\n\nThe throughline: you declare *desired state*, the control loop continuously makes *actual state* match." },

    { id:"r-probes", cat:"k8s",
      prompt:"Readiness, liveness, and startup probes — what's the difference?",
      a:"Three health checks Kubernetes runs against your container, answering different questions:\n\n- **Readiness** — *'can it take traffic right now?'* If it fails, K8s pulls the pod out of the Service endpoints but does **not** restart it. For startup warm-up or a temporarily-down dependency.\n- **Liveness** — *'is it still healthy, or wedged?'* If it fails, K8s **kills and restarts** the container. For recovering from hangs/deadlocks.\n- **Startup** — for slow-booting apps: holds the other two off until the app has finished starting, so a slow boot isn't mistaken for a failure.\n\n**Quick tell:** READY 0/1 → **readiness**; a climbing RESTARTS count → **liveness** (or a crash). Point the readiness probe at a lightweight health endpoint that checks your real dependencies." },

    { id:"r-broker", cat:"design",
      prompt:"RabbitMQ vs Kafka — when would you pick each?",
      a:"Both move messages between services, but they're built on different models:\n\n**RabbitMQ** — a traditional **message broker / queue**. A message is delivered to a consumer and, once acknowledged, it's **gone**. Rich routing (exchanges, routing keys), great for **task/work queues** and request-style workloads — \"process this payment,\" \"send this email.\"\n\n**Kafka** — a **distributed, append-only log**. Messages are **retained** for a configured window, and consumers track their own offset — so multiple consumers can read the same stream independently and you can **replay** from any point. Built for **high-throughput event streaming**, event sourcing, feeding analytics.\n\nRule of thumb: *\"do this task\" → RabbitMQ; \"this happened, and others may care now or later\" → Kafka.* Kafka for durable replayable streams, Rabbit for routed work queues." },

    { id:"r-idem", cat:"design",
      prompt:"At-least-once delivery and idempotency — why do they go together?",
      a:"Most brokers guarantee **at-least-once** delivery: to be sure a message isn't lost, they'll redeliver if they don't get an ack — which means a consumer can receive the **same message more than once** (a retry, a network blip, a redeploy mid-processing).\n\nSo the consumer **must be idempotent**: processing the same message twice must have the **same effect as processing it once**. Otherwise you double-charge a card or issue a policy twice.\n\n**How you make it idempotent:**\n- Give each message a stable **unique key** (message id / business key).\n- Before acting, check whether that key was already processed — a **dedup table** or a unique DB constraint.\n- Do the check-and-write **atomically** (a transaction / an upsert) so two concurrent copies can't both slip through.\n\nOne line: at-least-once means duplicates *will* happen, so correctness has to live in the consumer, not the broker." },

    { id:"r-star", cat:"exp",
      prompt:"STAR: tell me about a hard production problem you solved.",
      a:"So at a high level this is a classic race condition, where two requests try to create the same thing at the same time and you end up with a duplicate. So I solved it the standard way, make the check-and-write atomic, wrap it in a transaction, and add an idempotency key.\n\nSo the situation, at Senang our policy issuance fired automatically when a payment succeeded. But it could be triggered from two places, the asynchronous gateway callback, and the synchronous redirect when the user came back to us. And under certain timing both would fire, plus the gateway can legitimately send the same success more than once. So both flows would check, has this been issued yet, both see no, and both issue a policy. So the customer ends up with two policies, which for insurance is a real financial and compliance problem.\n\nSo my task was to issue exactly one policy per payment, without losing any legitimate issuance, even under retries.\n\nThe root cause was a read-then-write race, so the check and the write weren't atomic, and there was nothing at the database level stopping a second one. So the fix was to make that check-and-write atomic, so only one request can win. I did it with an atomic status transition, basically one update that flips the payment from unissued to issued only if it's still unissued. So whichever flow claims it first wins, and the second one just becomes a no-op.\n\nI wrapped that in a transaction so it's all-or-nothing, commit or rollback, and I added an idempotency key on the payment id, so a repeated callback returns the original policy instead of issuing a new one. And I put a unique constraint on it as a backstop, so even if two somehow got through, the second insert just fails.\n\nTo prove it, I fired the callback and the redirect at the same time to simulate the race, and confirmed only one policy came out.\n\nSo the result was that duplicate issuance stopped completely, exactly one policy per payment even under retries or concurrent callbacks, and it cut down the manual cancellations and support tickets. And the lesson I carry from it is, for anything money or issuance related, make the critical step idempotent and atomic, and never rely on read-then-write." },

    { id:"r-why", cat:"exp",
      prompt:"Why do you want to go back to C#/.NET after years in Angular/Node?",
      a:"I'll be honest about the timeline: my heaviest hands-on .NET was 2018 to 2023, and recently I've been leading Angular and Node work. But two things make this a *return*, not a leap.\n\nFirst, the **fundamentals never left** — the OOP and SOLID thinking, async, DI, clean layering — I've been applying every one of those in TypeScript daily. The mental model is identical; it's the syntax I'm refreshing, not the concepts.\n\nSecond, it's a **deliberate choice**. Strongly-typed, backend-heavy, transactional systems are the work I do best and enjoy most — the payments and issuance work I'm proudest of is exactly that shape. .NET is where I want to go deep again, and I've been actively rebuilding the muscle memory rather than waiting to be handed it." },

    { id:"b-about", cat:"behav",

    { id:"b-strength", cat:"behav",

    { id:"b-conflict", cat:"behav",
      prompt:"Tell me about a conflict or disagreement at work.",
      a:"So we once had a disagreement about how to handle duplicate messages. One view was to just do a quick patch, and I felt we needed proper idempotency.\n\nSo instead of pushing my opinion, I laid out the actual failure case, that a double issuance is a real financial and compliance risk, and I proposed the atomic check-and-write approach. And from there we agreed on a plan together.\n\nWe ended up shipping the robust fix, and the relationship stayed good, because I kept the whole thing about the risk, not about who was right. So for me the lesson is, you can disagree on the idea as long as you stay aligned on the goal." },

    { id:"b-fail", cat:"behav",
